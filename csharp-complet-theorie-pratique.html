filtre(4));  // appelle EstPair(4) indirectement\n```\n\n**Expressions lambda** (déjà rencontrées avec LINQ) sont en réalité des delegates anonymes : `x => x % 2 == 0` peut être assigné directement à une variable de type `Filtre`.\n\n**Delegates prédéfinis du framework**, à privilégier plutôt que de déclarer son propre delegate :\n- `Action` : méthode sans retour (`Action<string>` prend un paramètre string, ne retourne rien)\n- `Func<T,TResult>` : méthode avec retour (`Func<int,bool>` prend un int, retourne un bool)\n- `Predicate<T>` : équivalent à `Func<T,bool>`, utilisé notamment par `List<T>.Find()`\n\n**Événements (`event`)** : un cas d'usage spécialisé des delegates, permettant à un objet de **notifier** d'autres parties du code qu'un événement s'est produit (ex. un article passe en rupture de stock) — chaque abonné réagit sans que la classe qui déclenche l'événement ait besoin de le connaître à l'avance.","codeTitle":"Func, Action et un événement de rupture de stock","codeLang":"csharp","code":"using System;\n\nclass Article\n{\n    public string Reference;\n    private int stock;\n\n    // Événement : d'autres parties du code peuvent s'y abonner\n    public event Action<string> RuptureStock;\n\n    public int Stock\n    {\n        get => stock;\n        set\n        {\n            stock = value;\n            if (stock == 0)\n                RuptureStock?.Invoke(Reference);  // notifie tous les abonnés\n        }\n    }\n}\n\nclass Program\n{\n    static void Main()\n    {\n        // Func<T,TResult> : prend un int, retourne un bool\n        Func<int, bool> estPair = n => n % 2 == 0;\n        Console.WriteLine(estPair(7));  // False\n\n        // Action<T> : prend un string, ne retourne rien\n        Action<string> afficherAlerte = msg => Console.WriteLine($\"ALERTE : {msg}\");\n\n        Article article = new Article { Reference = \"ART001\", Stock = 5 };\n        article.RuptureStock += afficherAlerte;         // abonnement à l'événement\n        article.RuptureStock += ref_ => Console.WriteLine($\"Commander {ref_} d'urgence !\");\n\n        article.Stock = 0;   // déclenche RuptureStock -> les 2 abonnés réagissent\n    }\n}","keypoints":["Un delegate représente une méthode elle-même, passable en paramètre ou stockable","Func<T,TResult> retourne une valeur, Action<T> n'en retourne pas","Une expression lambda est un delegate anonyme concis","event permet à un objet de notifier plusieurs abonnés sans les connaître à l'avance"],"exercise":"Ajoutez un second événement StockFaible déclenché quand le stock passe sous 3, avec au moins un abonné qui affiche un message."},{"id":"cs-fichiers","module":"C# — Fonctionnalités avancées","title":"Fichiers et flux : lire et écrire sur le disque","minutes":16,"difficulty":"Intermédiaire","theory":"Le namespace `System.IO` fournit les outils pour lire et écrire des fichiers. Les méthodes statiques de la classe `File` couvrent la majorité des besoins simples :\n\n- `File.WriteAllText(chemin, texte)` : écrit (en écrasant) tout le contenu d'un fichier texte.\n- `File.AppendAllText(chemin, texte)` : ajoute du texte à la fin d'un fichier existant.\n- `File.ReadAllText(chemin)` : lit tout le contenu d'un fichier en une seule chaîne.\n- `File.ReadAllLines(chemin)` : lit le fichier sous forme de tableau de lignes (`string[]`).\n- `File.Exists(chemin)` : teste l'existence avant de lire, pour éviter une exception.\n\nPour des fichiers volumineux ou un traitement ligne par ligne sans tout charger en mémoire, on utilise `StreamReader` / `StreamWriter`, à toujours encadrer d'un `using` (libère automatiquement la ressource, même en cas d'exception) :\n\n```\nusing (StreamWriter sw = new StreamWriter(chemin))\n{\n    sw.WriteLine(\"Une ligne\");\n}   // le fichier est automatiquement refermé ici, même en cas d'erreur\n```\n\n**Gestion d'erreurs spécifique aux fichiers** : `FileNotFoundException`, `UnauthorizedAccessException`, `IOException` (fichier verrouillé par un autre programme) — à capturer explicitement autour de toute opération sur fichier, exactement comme on l'a fait pour `COMException` avec Sage 100c.\n\nCas d'usage typique en classe : exporter la liste d'élèves ou d'articles saisis en mémoire vers un fichier `.txt` ou `.csv`, ou au contraire charger un catalogue depuis un fichier au démarrage du programme.","codeTitle":"Exporter puis relire une liste d'articles au format CSV","codeLang":"csharp","code":"using System;\nusing System.IO;\nusing System.Collections.Generic;\n\nclass Article\n{\n    public string Reference, Libelle;\n    public double Prix;\n}\n\nclass Program\n{\n    static void Main()\n    {\n        string chemin = \"articles.csv\";\n\n        List<Article> articles = new List<Article>\n        {\n            new Article { Reference = \"ART001\", Libelle = \"Cahier\", Prix = 3500 },\n            new Article { Reference = \"ART002\", Libelle = \"Stylo\",  Prix = 500  },\n        };\n\n        // Écriture : une ligne CSV par article\n        using (StreamWriter sw = new StreamWriter(chemin))\n        {\n            foreach (var a in articles)\n                sw.WriteLine($\"{a.Reference};{a.Libelle};{a.Prix}\");\n        }\n        Console.WriteLine(\"Export terminé.\");\n\n        // Lecture et reconstruction des objets\n        try\n        {\n            if (File.Exists(chemin))\n            {\n                string[] lignes = File.ReadAllLines(chemin);\n                foreach (string ligne in lignes)\n                {\n                    string[] champs = ligne.Split(';');\n                    Console.WriteLine($\"Relu : {champs[0]} - {champs[1]} - {champs[2]} Ar\");\n                }\n            }\n        }\n        catch (IOException ex)\n        {\n            Console.WriteLine($\"Erreur de lecture : {ex.Message}\");\n        }\n    }\n}","keypoints":["File.WriteAllText/ReadAllText/ReadAllLines couvrent la majorité des besoins simples","using (StreamWriter/StreamReader ...) { } libère automatiquement la ressource","Toujours tester File.Exists() ou capturer IOException avant/pendant une lecture","Le format CSV (valeurs séparées par ; ou ,) est une façon simple de persister des objets ligne par ligne"],"exercise":"Modifiez l'exemple pour que la lecture reconstruise réellement des objets Article (pas seulement un affichage), stockés dans une nouvelle List<Article>."},{"id":"cs-async","module":"C# — Fonctionnalités avancées","title":"Programmation asynchrone : async / await","minutes":18,"difficulty":"Avancé","theory":"Une opération **asynchrone** (lecture réseau, accès fichier volumineux, appel à un service externe) peut prendre du temps sans bloquer le reste du programme pendant l'attente — essentiel pour une application réactive (interface graphique qui ne « gèle » pas, serveur qui traite plusieurs requêtes en parallèle).\n\n**`Task`** représente une opération en cours, dont le résultat sera disponible plus tard. **`async`** marque une méthode comme asynchrone ; **`await`** suspend l'exécution de cette méthode (sans bloquer le thread) jusqu'à ce que la tâche attendue soit terminée.\n\n```\nstatic async Task<string> TelechargerAsync(string url)\n{\n    // ... opération longue simulée ...\n    await Task.Delay(1000);   // suspend sans bloquer, ici 1 seconde\n    return \"Contenu téléchargé\";\n}\n```\n\nRègles essentielles :\n- Une méthode `async` retourne généralement `Task` (rien à renvoyer) ou `Task<T>` (renvoie un `T`), jamais directement `T`.\n- `await` ne peut être utilisé qu'à l'intérieur d'une méthode marquée `async`.\n- Appeler une méthode asynchrone sans `await` la lance mais **ne garantit pas** qu'elle soit terminée avant la suite du code — source d'erreurs classique.\n- Convention de nommage : suffixer les méthodes asynchrones par `Async` (`TelechargerAsync`).\n\nCe mécanisme deviendra pertinent dès qu'une application C# interagit avec des ressources externes lentes — fichiers volumineux, appels réseau, bases de données — un contexte que l'on retrouve au-delà de ce cours, par exemple pour des opérations longues sur de grosses bases Sage 100c.","codeTitle":"Simuler deux téléchargements en parallèle avec async/await","codeLang":"csharp","code":"using System;\nusing System.Threading.Tasks;\n\nclass Program\n{\n    static async Task<string> TelechargerAsync(string nomFichier, int dureeMs)\n    {\n        Console.WriteLine($\"Début téléchargement de {nomFichier}...\");\n        await Task.Delay(dureeMs);   // simule une attente réseau sans bloquer le programme\n        Console.WriteLine($\"{nomFichier} terminé.\");\n        return $\"Contenu de {nomFichier}\";\n    }\n\n    static async Task Main()\n    {\n        // Lancement des deux tâches en parallèle (pas l'une après l'autre)\n        Task<string> t1 = TelechargerAsync(\"rapport.pdf\", 2000);\n        Task<string> t2 = TelechargerAsync(\"catalogue.csv\", 1000);\n\n        // await attend que les deux soient terminées, sans bloquer entretemps\n        string[] resultats = await Task.WhenAll(t1, t2);\n\n        foreach (var r in resultats)\n            Console.WriteLine(r);\n\n        Console.WriteLine(\"Les deux téléchargements sont terminés.\");\n    }\n}","keypoints":["async/await permet d'attendre une opération longue sans bloquer le programme","Une méthode async retourne Task (rien) ou Task<T> (une valeur), jamais T directement","Task.WhenAll() attend plusieurs tâches lancées en parallèle","Convention : suffixer les méthodes asynchrones par Async"],"exercise":"Ajoutez une troisième tâche TelechargerAsync('images.zip', 3000) au Task.WhenAll et vérifiez que l'ordre d'affichage des 'terminé' ne suit pas forcément l'ordre de lancement."},{"id":"cs-extensions","module":"C# — Fonctionnalités avancées","title":"Méthodes d'extension : enrichir un type existant","minutes":12,"difficulty":"Avancé","theory":"Une **méthode d'extension** permet d'ajouter une méthode à un type **déjà existant** (même un type du framework comme `string` ou `List<T>`) sans modifier son code source ni créer de classe dérivée — c'est ainsi que fonctionnent la plupart des méthodes LINQ (`.Where()`, `.Select()`...), qui sont en réalité des extensions de `IEnumerable<T>`.\n\nRègles de déclaration :\n- La méthode doit être `static`, dans une classe `static`.\n- Le premier paramètre est précédé de `this` : il désigne le type étendu.\n\n```\nstatic class StringExtensions\n{\n    public static bool EstEmailValide(this string texte)\n    {\n        return texte.Contains(\"@\") && texte.Contains(\".\");\n    }\n}\n```\n\nUne fois définie (et son namespace importé via `using`), l'extension s'utilise comme une méthode native du type : `\"test@mail.com\".EstEmailValide()` — alors qu'il s'agit en réalité d'un appel déguisé à `StringExtensions.EstEmailValide(\"test@mail.com\")`.\n\nIntérêt pédagogique direct : comprendre les méthodes d'extension explique **pourquoi** `.Where()` ou `.Sum()` semblent « appartenir » à `List<T>` alors qu'elles sont définies ailleurs, dans la classe statique `Enumerable` du framework.","codeTitle":"Créer sa propre méthode d'extension sur List<T>","codeLang":"csharp","code":"using System;\nusing System.Collections.Generic;\n\nstatic class ListeExtensions\n{\n    // Extension générique : fonctionne sur List<T> quel que soit T\n    public static void AfficherTous<T>(this List<T> liste, string separateur = \", \")\n    {\n        Console.WriteLine(string.Join(separateur, liste));\n    }\n}\n\nstatic class StringExtensions\n{\n    public static bool EstEmailValide(this string texte)\n    {\n        return texte.Contains(\"@\") && texte.Contains(\".\");\n    }\n}\n\nclass Program\n{\n    static void Main()\n    {\n        List<string> eleves = new List<string> { \"Rina\", \"Tojo\", \"Faniry\" };\n        eleves.AfficherTous(\" | \");   // s'utilise comme une méthode native de List<T>\n\n        string email = \"eleve@ecole.mg\";\n        Console.WriteLine(email.EstEmailValide());  // True\n    }\n}","keypoints":["Une méthode d'extension ajoute un comportement à un type existant sans le modifier","static class + static méthode + this sur le 1er paramètre = signature d'une extension","C'est exactement le mécanisme derrière .Where(), .Select(), .Sum() de LINQ","Une extension s'appelle comme une méthode native une fois son namespace importé"],"exercise":"Créez une méthode d'extension EstMajeur(this int age) qui retourne true si age >= 18, et testez-la sur plusieurs valeurs."},{"id":"cs-records","module":"C# — Fonctionnalités avancées","title":"Records : modéliser des données immuables","minutes":12,"difficulty":"Avancé","theory":"Un **record** (C# 9+) est une variante de classe optimisée pour représenter des **données** plutôt qu'un comportement — typiquement une valeur qui, une fois créée, ne doit plus changer (immuabilité).\n\n```\nrecord Coordonnees(double Latitude, double Longitude);\n```\n\nCette seule ligne génère automatiquement : les propriétés `Latitude`/`Longitude` en lecture seule, un constructeur, une comparaison d'**égalité par valeur** (deux records avec les mêmes données sont considérés égaux, contrairement à une `class` classique comparée par référence), et un affichage lisible via `ToString()`.\n\n**Différence clé avec `class`** :\n```\nCoordonnees c1 = new(48.85, 2.35);\nCoordonnees c2 = new(48.85, 2.35);\nConsole.WriteLine(c1 == c2);   // True pour un record (égalité par valeur)\n                                // False pour une class équivalente (égalité par référence)\n```\n\n**`with` expression** : `Coordonnees c3 = c1 with { Latitude = 50.0 };` crée une **nouvelle** copie de `c1` avec seulement `Latitude` modifiée — `c1` reste inchangé. C'est le moyen idiomatique de « modifier » un record tout en préservant son immuabilité.\n\nCas d'usage typique : représenter un résultat de calcul, un DTO (objet de transfert de données), une configuration — partout où l'on veut garantir qu'une donnée, une fois créée, ne sera jamais modifiée par erreur ailleurs dans le code.","codeTitle":"Comparer record et class sur l'égalité et l'immuabilité","codeLang":"csharp","code":"using System;\n\nrecord ArticlePanier(string Reference, int Quantite);   // immuable, égalité par valeur\n\nclass Program\n{\n    static void Main()\n    {\n        ArticlePanier a1 = new(\"ART001\", 2);\n        ArticlePanier a2 = new(\"ART001\", 2);\n\n        Console.WriteLine(a1 == a2);   // True : égalité par VALEUR, pas par référence\n        Console.WriteLine(a1);          // ArticlePanier { Reference = ART001, Quantite = 2 }\n\n        // with : crée une NOUVELLE copie modifiée, a1 reste inchangé\n        ArticlePanier a3 = a1 with { Quantite = 5 };\n        Console.WriteLine(a1);  // toujours Quantite = 2\n        Console.WriteLine(a3);  // Quantite = 5\n\n        // a1.Quantite = 10;   // ERREUR de compilation : propriété en lecture seule (immuable)\n    }\n}","keypoints":["record modélise une donnée immuable avec égalité par valeur automatique","== compare le contenu pour un record, la référence pour une class classique","with crée une copie modifiée sans altérer l'original (immuabilité préservée)","Cas d'usage type : DTO, résultat de calcul, configuration — toute donnée qui ne doit pas changer après création"],"exercise":"Créez un record ResultatExamen(string Eleve, double Note) et, à partir d'un ResultatExamen existant, produisez une copie avec with où seule la Note change."}];
const EXERCISES = [{"id":"ex-fizzbuzz","title":"FizzBuzz","difficulty":"Débutant","themes":["Boucles","Conditions"],"statement":"Affichez les nombres de 1 à 100. Pour les multiples de 3, affichez « Fizz » à la place du nombre. Pour les multiples de 5, affichez « Buzz ». Pour les multiples de 3 ET 5, affichez « FizzBuzz ».","hints":["Testez d'abord la condition la plus restrictive (multiple de 3 ET 5) avant les conditions simples.","L'opérateur % (modulo) donne le reste d'une division : n % 3 == 0 teste un multiple de 3."],"solutionSketch":"for (int i = 1; i <= 100; i++)\n{\n    if (i % 15 == 0) Console.WriteLine(\"FizzBuzz\");\n    else if (i % 3 == 0) Console.WriteLine(\"Fizz\");\n    else if (i % 5 == 0) Console.WriteLine(\"Buzz\");\n    else Console.WriteLine(i);\n}"},{"id":"ex-palindrome","title":"Palindrome","difficulty":"Débutant","themes":["Chaînes","Boucles"],"statement":"Écrivez une méthode EstPalindrome(string mot) qui retourne true si le mot se lit de la même façon à l'endroit et à l'envers (ex. 'radar'), en ignorant la casse.","hints":["Comparez le mot à sa version inversée.","string.ToLower() uniformise la casse avant comparaison.","Pour inverser une chaîne : construire un nouveau string en la parcourant à l'envers, ou utiliser Array.Reverse sur un tableau de char."],"solutionSketch":"static bool EstPalindrome(string mot)\n{\n    string m = mot.ToLower();\n    char[] lettres = m.ToCharArray();\n    Array.Reverse(lettres);\n    string inverse = new string(lettres);\n    return m == inverse;\n}"},{"id":"ex-tri-bulle","title":"Tri à bulles","difficulty":"Intermédiaire","themes":["Tableaux","Boucles"],"statement":"Implémentez l'algorithme du tri à bulles pour trier un tableau d'entiers dans l'ordre croissant, sans utiliser Array.Sort().","hints":["Deux boucles imbriquées : la boucle externe répète les passages, l'interne compare deux éléments voisins.","Si un élément est plus grand que son voisin de droite, échangez-les (variable temporaire)."],"solutionSketch":"static void TriBulles(int[] tab)\n{\n    for (int i = 0; i < tab.Length - 1; i++)\n    {\n        for (int j = 0; j < tab.Length - 1 - i; j++)\n        {\n            if (tab[j] > tab[j + 1])\n            {\n                int tmp = tab[j];\n                tab[j] = tab[j + 1];\n                tab[j + 1] = tmp;\n            }\n        }\n    }\n}"},{"id":"ex-compte-mots","title":"Compteur de mots","difficulty":"Intermédiaire","themes":["Chaînes","Dictionary","LINQ"],"statement":"Écrivez une méthode qui prend un texte et retourne un Dictionary<string,int> donnant, pour chaque mot (en minuscules), le nombre d'occurrences dans le texte.","hints":["string.Split(' ') découpe le texte en mots.","Parcourez les mots et incrémentez un compteur dans le dictionnaire (ContainsKey ou TryGetValue).","Pensez à nettoyer la ponctuation avec .Trim(',','.','!','?') si besoin."],"solutionSketch":"static Dictionary<string,int> CompterMots(string texte)\n{\n    var compteur = new Dictionary<string,int>();\n    string[] mots = texte.ToLower().Split(' ');\n    foreach (string mot in mots)\n    {\n        string propre = mot.Trim(',', '.', '!', '?');\n        if (propre == \"\") continue;\n        if (compteur.ContainsKey(propre)) compteur[propre]++;\n        else compteur[propre] = 1;\n    }\n    return compteur;\n}"},{"id":"ex-pile-genrique","title":"Pile générique bornée","difficulty":"Avancé","themes":["Génériques","Exceptions"],"statement":"Créez une classe générique PileBornee<T> avec une capacité maximale fixée au constructeur. Empiler() doit lever une exception explicite si la pile est pleine, et Depiler() si elle est vide.","hints":["Stockez les éléments dans une List<T> interne.","Comparez List.Count à la capacité avant d'ajouter.","throw new InvalidOperationException(\"message\") est adapté à ce cas."],"solutionSketch":"class PileBornee<T>\n{\n    private List<T> elements = new List<T>();\n    private int capacite;\n\n    public PileBornee(int capacite) { this.capacite = capacite; }\n\n    public void Empiler(T item)\n    {\n        if (elements.Count >= capacite)\n            throw new InvalidOperationException(\"Pile pleine.\");\n        elements.Add(item);\n    }\n\n    public T Depiler()\n    {\n        if (elements.Count == 0)\n            throw new InvalidOperationException(\"Pile vide.\");\n        T last = elements[^1];\n        elements.RemoveAt(elements.Count - 1);\n        return last;\n    }\n}"},{"id":"ex-hierarchie-employes","title":"Hiérarchie d'employés polymorphe","difficulty":"Intermédiaire","themes":["Héritage","Polymorphisme"],"statement":"Créez une classe abstraite Employe (Nom, méthode abstraite CalculerSalaire()) puis deux classes dérivées EmployeFixe (salaire fixe) et EmployeCommission (salaire de base + commission sur ventes). Affichez le salaire de chaque employé d'une liste polymorphe via une boucle unique.","hints":["EmployeCommission a besoin d'un champ ventes en plus du salaire de base.","Utilisez List<Employe> pour stocker les deux types dans la même collection."],"solutionSketch":"abstract class Employe\n{\n    public string Nom;\n    public abstract double CalculerSalaire();\n}\nclass EmployeFixe : Employe\n{\n    public double Salaire;\n    public override double CalculerSalaire() => Salaire;\n}\nclass EmployeCommission : Employe\n{\n    public double SalaireBase, Ventes, TauxCommission;\n    public override double CalculerSalaire() => SalaireBase + Ventes * TauxCommission;\n}\n// foreach (Employe e in listeEmployes) Console.WriteLine($\"{e.Nom}: {e.CalculerSalaire()}\");"},{"id":"ex-linq-eleves","title":"Analyse LINQ d'une classe","difficulty":"Intermédiaire","themes":["LINQ","Collections"],"statement":"À partir d'une List<Eleve> (Nom, List<double> Notes), écrivez en LINQ : (1) la moyenne générale de la classe, (2) le nom de l'élève ayant la meilleure moyenne, (3) la liste des élèves en dessous de 10 de moyenne, triée par ordre alphabétique.","hints":["Une propriété calculée Moyenne sur Eleve simplifie beaucoup les requêtes.",".Average() sur une liste de moyennes donne la moyenne générale.",".OrderByDescending(e => e.Moyenne).First() donne le meilleur élève."],"solutionSketch":"// Eleve avec propriété calculée :\n// public double Moyenne => Notes.Average();\n\ndouble moyenneClasse = eleves.Average(e => e.Moyenne);\nstring meilleurEleve = eleves.OrderByDescending(e => e.Moyenne).First().Nom;\nvar enDifficulte = eleves.Where(e => e.Moyenne < 10)\n                          .OrderBy(e => e.Nom)\n                          .Select(e => e.Nom)\n                          .ToList();"},{"id":"ex-validation-formulaire","title":"Validateur de formulaire","difficulty":"Intermédiaire","themes":["Exceptions","Chaînes","Nullable"],"statement":"Écrivez une méthode ValiderInscription(string nom, string email, int? age) qui lève une ArgumentException avec un message précis si : nom est vide, email ne contient pas '@', ou age est null ou négatif.","hints":["Une exception par condition, avec un message explicite pour chaque cas.","string.IsNullOrWhiteSpace(nom) teste proprement une chaîne vide ou uniquement des espaces."],"solutionSketch":"static void ValiderInscription(string nom, string email, int? age)\n{\n    if (string.IsNullOrWhiteSpace(nom))\n        throw new ArgumentException(\"Le nom est obligatoire.\");\n    if (!email.Contains(\"@\"))\n        throw new ArgumentException(\"Email invalide.\");\n    if (age == null || age < 0)\n        throw new ArgumentException(\"Âge invalide.\");\n}"},{"id":"ex-fichier-notes","title":"Carnet de notes persistant","difficulty":"Avancé","themes":["Fichiers","Collections","Exceptions"],"statement":"Écrivez un programme qui charge une liste de notes depuis un fichier notes.txt (une note par ligne) au démarrage — s'il n'existe pas, démarrer avec une liste vide — permet d'ajouter une note, puis sauvegarde la liste mise à jour dans le fichier avant de quitter.","hints":["File.Exists() avant de lire évite une exception au premier lancement.","Convertissez chaque ligne en double avec double.Parse ou double.TryParse.","File.WriteAllLines() accepte un IEnumerable<string> : convertissez vos doubles avec .Select(n => n.ToString())."],"solutionSketch":"List<double> notes = new List<double>();\nif (File.Exists(\"notes.txt\"))\n{\n    foreach (string ligne in File.ReadAllLines(\"notes.txt\"))\n        if (double.TryParse(ligne, out double n)) notes.Add(n);\n}\n\nnotes.Add(15.5);  // exemple d'ajout\n\nFile.WriteAllLines(\"notes.txt\", notes.Select(n => n.ToString()));"},{"id":"ex-async-simulateur","title":"Simulateur de commandes asynchrone","difficulty":"Avancé","themes":["Async/await","Delegates"],"statement":"Écrivez une méthode TraiterCommandeAsync(string id) qui simule un traitement de 500 à 2000 ms (aléatoire) puis affiche 'Commande {id} traitée'. Lancez le traitement de 5 commandes en parallèle avec Task.WhenAll et mesurez le temps total avec un Stopwatch.","hints":["System.Diagnostics.Stopwatch : sw.Start(), sw.Stop(), sw.ElapsedMilliseconds.","new Random().Next(500,2000) pour un délai aléatoire.","Le temps total doit être proche du délai le plus long, pas de la somme de tous les délais (preuve du parallélisme)."],"solutionSketch":"static async Task TraiterCommandeAsync(string id)\n{\n    int delai = new Random().Next(500, 2000);\n    await Task.Delay(delai);\n    Console.WriteLine($\"Commande {id} traitée ({delai} ms)\");\n}\n\nvar sw = System.Diagnostics.Stopwatch.StartNew();\nvar taches = new[] { \"C1\",\"C2\",\"C3\",\"C4\",\"C5\" }.Select(TraiterCommandeAsync);\nawait Task.WhenAll(taches);\nsw.Stop();\nConsole.WriteLine($\"Temps total : {sw.ElapsedMilliseconds} ms\");"},{"id":"ex-record-immuable","title":"Panier immuable avec records","difficulty":"Avancé","themes":["Records","Immuabilité"],"statement":"En utilisant un record LigneCommande(string Article, int Quantite, double PrixUnitaire), écrivez une méthode qui calcule le total d'une liste de LigneCommande, puis créez une nouvelle ligne à partir d'une existante avec une quantité doublée, sans modifier l'originale.","hints":["Un record permet with { Propriete = nouvelleValeur } pour créer une copie modifiée.","Total d'une ligne = Quantite * PrixUnitaire ; sommez avec .Sum() en LINQ."],"solutionSketch":"record LigneCommande(string Article, int Quantite, double PrixUnitaire);\n\ndouble total = lignes.Sum(l => l.Quantite * l.PrixUnitaire);\n\nLigneCommande ligneDoublee = ligneOriginale with { Quantite = ligneOriginale.Quantite * 2 };\n// ligneOriginale reste inchangée"}];
const PROJECTS = [{"id":"proj-bibliotheque","title":"Gestionnaire de bibliothèque scolaire","difficulty":"Débutant → Intermédiaire","duration":"2 à 3 séances","concepts":["Classes","Encapsulation","Collections","LINQ"],"description":"Un petit programme console pour gérer les emprunts de livres d'une bibliothèque de classe : catalogue de livres, liste de membres, emprunts et retours, avec recherche.","requirements":["Classe Livre (Titre, Auteur, ISBN, Disponible)","Classe Membre (Nom, List<Livre> LivresEmpruntes)","Classe Bibliotheque qui centralise List<Livre> et List<Membre>","Méthode Emprunter(membre, livre) : refuse si le livre n'est pas disponible, marque Disponible = false","Méthode Retourner(membre, livre) : remet Disponible = true","Une recherche par titre ou par auteur avec LINQ (.Where + Contains, insensible à la casse)","Un menu console en boucle (switch) proposant : Emprunter / Retourner / Rechercher / Lister les livres disponibles / Quitter"],"hints":["Commencez par les classes sans le menu, testez-les depuis Main() avec des données codées en dur.","Le menu console est une boucle while(true) avec un switch sur la saisie, et un cas 'Quitter' qui fait break."]},{"id":"proj-notes","title":"Système de gestion des notes de classe","difficulty":"Intermédiaire","duration":"2 séances","concepts":["Classes","LINQ","Fichiers","Tri"],"description":"Un programme qui gère les notes d'une classe sur plusieurs matières, calcule des moyennes pondérées par coefficient, classe les élèves, et exporte un bulletin en fichier texte.","requirements":["Classe Matiere (Nom, Coefficient)","Classe Eleve (Nom, Dictionary<Matiere,double> Notes)","Méthode MoyennePonderee(eleve) : somme(note*coef) / somme(coef)","Classement de la classe par moyenne décroissante avec LINQ (OrderByDescending)","Export d'un bulletin par élève dans un fichier .txt (nom, notes par matière, moyenne, rang dans la classe)","Gestion des cas limites : élève sans aucune note (éviter une division par zéro)"],"hints":["Pour le rang, calculez d'abord la liste triée, puis utilisez son index (+1) plutôt qu'un tri par élève.","Sum(kv => kv.Value * kv.Key.Coefficient) sur un Dictionary<Matiere,double> calcule le numérateur pondéré directement."]},{"id":"proj-inventaire","title":"Mini-inventaire avec persistance CSV","difficulty":"Intermédiaire → Avancé","duration":"2 à 3 séances","concepts":["POO","Fichiers","Exceptions","LINQ"],"description":"Une application de gestion de stock qui persiste son catalogue dans un fichier CSV entre deux exécutions, avec alertes de rupture de stock via un événement.","requirements":["Classe Article (Reference, Libelle, Prix, Quantite) avec un event StockFaible déclenché sous un seuil défini","Chargement du catalogue depuis inventaire.csv au démarrage (créer un catalogue vide si le fichier n'existe pas)","Sauvegarde automatique du catalogue dans le même fichier à chaque modification","Opérations : ajouter un article, vendre (diminue la quantité, vérifie qu'elle ne devient pas négative), réapprovisionner","Rapport LINQ : valeur totale du stock, top 3 articles les plus chers, articles en rupture","Toute erreur de lecture/écriture fichier doit être interceptée avec un message clair, sans faire planter le programme"],"hints":["Le format CSV proposé en leçon 'Fichiers et flux' (séparateur ;) suffit, pas besoin de bibliothèque externe.","Le seuil de l'event StockFaible peut être un simple paramètre du constructeur d'Article."]},{"id":"proj-quiz","title":"Quiz interactif chronométré","difficulty":"Avancé","duration":"2 séances","concepts":["Async/await","Delegates/events","Collections","Exceptions"],"description":"Un quiz en ligne de commande avec un chronomètre par question, un système de score, et un événement déclenché en cas de bonne réponse.","requirements":["Classe Question (Enonce, List<string> Choix, IndexReponseCorrecte)","Un event BonneReponse déclenché à chaque réponse correcte (utilisé pour incrémenter un score et afficher un encouragement)","Chaque question dispose d'un délai limite (ex. 10 secondes) : au-delà, la question est comptée comme fausse (utiliser Task.WhenAny entre la saisie utilisateur et un Task.Delay)","Un score final avec pourcentage de réussite et une appréciation (Excellent / Bien / À revoir) via switch expression","Gestion propre d'une saisie invalide (ex. lettre au lieu d'un chiffre) sans planter le quiz"],"hints":["Task.WhenAny(tacheSaisie, Task.Delay(10000)) permet de savoir laquelle des deux tâches finit en premier.","La lecture clavier bloquante (Console.ReadLine) doit être lancée dans une Task séparée pour être 'course' contre le délai."]}];
const GLOSSARY = [{"terme":"Variable","def":"Espace mémoire nommé stockant une valeur d'un type donné, pouvant changer au cours du programme."},{"terme":"Type valeur / type référence","def":"Un type valeur (struct, int, bool...) copie la donnée elle-même ; un type référence (class) copie une adresse vers l'objet."},{"terme":"Classe","def":"Le plan/modèle décrivant la structure (champs) et le comportement (méthodes) d'un objet."},{"terme":"Objet","def":"Une instance concrète créée à partir d'une classe avec le mot-clé new."},{"terme":"Encapsulation","def":"Protection des données internes d'un objet, exposées de façon contrôlée via des propriétés et modificateurs d'accès."},{"terme":"Héritage","def":"Mécanisme permettant à une classe dérivée de réutiliser champs/méthodes d'une classe de base, via : ClasseParent."},{"terme":"Polymorphisme","def":"Capacité à appeler la même méthode sur des objets de types dérivés différents et obtenir le comportement propre à chacun."},{"terme":"Classe abstraite","def":"Classe ne pouvant jamais être instanciée directement, servant de base commune avec des méthodes abstraites à implémenter."},{"terme":"Interface","def":"Contrat définissant des méthodes/propriétés qu'une classe s'engage à implémenter, sans aucune implémentation dans l'interface elle-même."},{"terme":"Générique (Generic)","def":"Mécanisme permettant à une classe ou méthode de fonctionner avec n'importe quel type, déterminé à l'utilisation (List<T>...)."},{"terme":"Delegate","def":"Type représentant une méthode elle-même, permettant de la passer en paramètre ou de la stocker dans une variable."},{"terme":"Événement (event)","def":"Mécanisme basé sur les delegates permettant à un objet de notifier plusieurs abonnés qu'une action s'est produite."},{"terme":"LINQ","def":"Ensemble de méthodes (Where, Select, OrderBy...) permettant d'interroger une collection avec une syntaxe déclarative proche du SQL."},{"terme":"Exception","def":"Erreur survenant à l'exécution, interceptable avec try/catch pour éviter l'arrêt brutal du programme."},{"terme":"async / await","def":"Mots-clés permettant d'attendre une opération longue (Task) sans bloquer le reste du programme pendant l'attente."},{"terme":"Enum","def":"Type définissant un ensemble fermé de valeurs nommées, plus sûr qu'un string ou int libre."},{"terme":"Nullable","def":"Un type valeur suffixé de ? (int?, bool?...) peut alors contenir null pour représenter une absence de valeur."},{"terme":"Record","def":"Variante de classe optimisée pour des données immuables, avec égalité par valeur générée automatiquement."},{"terme":"Méthode d'extension","def":"Méthode statique ajoutant un comportement à un type existant sans le modifier, via this sur le 1er paramètre."},{"terme":"LINQ lambda","def":"Expression x => condition, une fonction anonyme concise très utilisée avec LINQ et les delegates."},{"terme":"List<T>","def":"Collection générique de taille variable, à privilégier sur les tableaux dès que la taille peut évoluer."},{"terme":"Dictionary<K,V>","def":"Collection associant une clé unique à une valeur, pour un accès rapide par clé."},{"terme":"Constructeur","def":"Méthode spéciale exécutée automatiquement à la création d'un objet, garantissant un état initial valide."},{"terme":"Namespace","def":"Espace de noms regroupant logiquement du code lié, importé avec le mot-clé using."}];
</script>
<script>
/* ===================== ÉTAT & UTILITAIRES ===================== */
const MODULE_ORDER = ["C# — Bases du langage","C# — Programmation orientée objet","C# — Collections & LINQ","C# — Gestion des erreurs & I/O","C# — Types avancés","C# — Fonctionnalités avancées"];
const MODULE_DESC = {
  "C# — Bases du langage":"Variables, types, opérateurs, conditions, boucles, tableaux, chaînes et méthodes — le socle indispensable avant toute POO.",
  "C# — Programmation orientée objet":"Classes, objets, encapsulation, constructeurs, héritage, classes abstraites et interfaces.",
  "C# — Collections & LINQ":"List<T>, Dictionary<K,V> et LINQ pour manipuler des ensembles de données efficacement.",
  "C# — Gestion des erreurs & I/O":"try/catch/finally pour sécuriser l'exécution d'un programme.",
  "C# — Types avancés":"Enum, struct vs class, et gestion propre des valeurs nulles.",
  "C# — Fonctionnalités avancées":"Génériques, delegates/événements, fichiers, async/await, extensions et records."
};

let state = {
  route: {view:"home"},
  progress: {},
  exFilter: {difficulty:"all", theme:"all"},
  revealed: {},   // exerciseId -> bool (solution shown)
};

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderTheory(txt){
  const lines = txt.split("\n");
  let html = "";
  let inList = false, inTable = false, tableRows = [];
  function closeList(){ if(inList){ html += "</ul>"; inList=false; } }
  function flushTable(){
    if(tableRows.length){
      html += "<table><thead><tr>" + tableRows[0].map(c=>`<th>${inlineMd(c)}</th>`).join("") + "</tr></thead><tbody>";
      for(let i=1;i<tableRows.length;i++){
        html += "<tr>" + tableRows[i].map(c=>`<td>${inlineMd(c)}</td>`).join("") + "</tr>";
      }
      html += "</tbody></table>";
      tableRows = [];
    }
    inTable = false;
  }
  function inlineMd(s){
    s = escapeHtml(s);
    s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/`(.+?)`/g, "<code>$1</code>");
    s = s.replace(/(?<!\*)\*([^*]+?)\*(?!\*)/g, "<em>$1</em>");
    return s;
  }
  for(let raw of lines){
    const line = raw.trim();
    if(line.startsWith("```")){ continue; }
    if(line.startsWith("|")){
      inTable = true;
      const cells = line.split("|").map(c=>c.trim()).filter((c,i,arr)=> !(c==="" && (i===0 || i===arr.length-1)));
      tableRows.push(cells);
      continue;
    } else if(inTable){ flushTable(); }
    if(line === ""){ closeList(); continue; }
    if(line.startsWith("- ")){
      if(!inList){ html += "<ul>"; inList = true; }
      html += `<li>${inlineMd(line.slice(2))}</li>`;
      continue;
    }
    closeList();
    html += `<p>${inlineMd(line)}</p>`;
  }
  closeList(); flushTable();
  return html;
}

function highlightCode(code, lang){
  let c = escapeHtml(code);
  c = c.replace(/(\/\/.*$)/gm, '<span class="tok-com">$1</span>');
  c = c.replace(/(&quot;.*?&quot;)/g, '<span class="tok-str">$1</span>');
  c = c.replace(/\b(using|new|static|void|if|else|foreach|in|return|try|catch|finally|class|struct|record|enum|interface|abstract|override|virtual|public|private|protected|readonly|var|true|false|null|this|throw|async|await|base|const|switch|case|default|get|set|where)\b/g,
    '<span class="tok-kw">$1</span>');
  c = c.replace(/\b(string|int|bool|double|DateTime|byte|List|Dictionary|Task|Func|Action|IEnumerable|Exception|COMException|IOException|Console|File|StreamReader|StreamWriter|Random|Stopwatch|Array)\b/g,
    '<span class="tok-type">$1</span>');
  c = c.replace(/\b(\d+\.?\d*)\b/g, '<span class="tok-num">$1</span>');
  return c;
}

function saveProgress(){
  try{ if(window.storage) window.storage.set('csharp-course-progress', JSON.stringify(state.progress), false); }catch(e){}
}
async function loadProgress(){
  try{
    if(window.storage){
      const r = await window.storage.get('csharp-course-progress', false);
      if(r && r.value) state.progress = JSON.parse(r.value);
    }
  }catch(e){}
  renderApp();
}
function toggleDone(lessonId){
  state.progress[lessonId] = !state.progress[lessonId];
  saveProgress();
  renderApp();
}

function go(route){
  state.route = route;
  window.scrollTo(0,0);
  renderApp();
  document.getElementById('sidebar').classList.remove('open');
}

/* ===================== SIDEBAR ===================== */
function renderSidebar(){
  const grouped = {};
  MODULE_ORDER.forEach(m => grouped[m] = []);
  THEORY.forEach(l => { if(!grouped[l.module]) grouped[l.module]=[]; grouped[l.module].push(l); });

  let html = `<div class="side-nav-top">
    <div class="side-item ${state.route.view==='home'?'active':''}" onclick="go({view:'home'})"><span class="dot"></span> Accueil</div>
    <div class="side-item ${state.route.view==='practice'?'active':''}" onclick="go({view:'practice'})"><span class="dot"></span> Partie Pratique <span style="margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text-dim)">${EXERCISES.length+PROJECTS.length}</span></div>
    <div class="side-item ${state.route.view==='glossaire'?'active':''}" onclick="go({view:'glossaire'})"><span class="dot"></span> Glossaire</div>
  </div>
  <div style="font-family:var(--serif);font-size:13px;font-weight:700;color:var(--gold);padding:6px 10px 8px;">Partie théorique</div>`;

  MODULE_ORDER.forEach(mod => {
    const items = grouped[mod];
    if(!items.length) return;
    const doneCount = items.filter(l=>state.progress[l.id]).length;
    html += `<div class="side-group">
      <div class="side-group-title">${mod} <span class="n">${doneCount}/${items.length}</span></div>`;
    items.forEach(l => {
      const active = state.route.view==='lesson' && state.route.id===l.id;
      const done = !!state.progress[l.id];
      html += `<div class="side-item ${active?'active':''} ${done?'done':''}" onclick="go({view:'lesson', id:'${l.id}'})">
        <span class="dot"></span> ${escapeHtml(l.title)}
      </div>`;
    });
    html += `</div>`;
  });
  document.getElementById('sidebar').innerHTML = html;
}

/* ===================== HOME ===================== */
function renderHome(){
  const total = THEORY.length;
  const done = Object.values(state.progress).filter(Boolean).length;
  const pct = total ? Math.round(done/total*100) : 0;

  let tracks = MODULE_ORDER.map(mod => {
    const items = THEORY.filter(l=>l.module===mod);
    if(!items.length) return "";
    const doneCount = items.filter(l=>state.progress[l.id]).length;
    return `<div class="track-card" onclick="go({view:'lesson', id:'${items[0].id}'})">
      <div class="tc-top"><h3>${mod}</h3><span class="tc-count">${doneCount}/${items.length}</span></div>
      <p>${MODULE_DESC[mod]}</p>
    </div>`;
  }).join("");

  return `
  <div class="hero">
    <div class="hero-eyebrow">Cours complet · Console C# / .NET</div>
    <h1>Apprendre le <em>C#</em> de A à Z</h1>
    <p class="lead">Un cours structuré en deux grandes parties : la <strong>théorie</strong> — ${total} leçons, des variables aux fonctionnalités avancées (génériques, async/await, records) — et la <strong>pratique</strong> — une banque d'exercices notés par difficulté et des mini-projets complets à réaliser en classe.</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <button class="mark-done-btn" style="background:var(--gold);color:#1a1305;border-color:var(--gold);" onclick="go({view:'lesson', id:'${THEORY[0].id}'})">Commencer la théorie →</button>
      <button class="mark-done-btn" onclick="go({view:'practice'})">Aller à la pratique</button>
    </div>
    <div class="hero-stats">
      <div class="hstat"><div class="num">${total}</div><div class="lbl">Leçons théoriques</div></div>
      <div class="hstat"><div class="num">${EXERCISES.length}</div><div class="lbl">Exercices notés</div></div>
      <div class="hstat"><div class="num">${PROJECTS.length}</div><div class="lbl">Mini-projets complets</div></div>
      <div class="hstat"><div class="num">${pct}%</div><div class="lbl">Progression théorie</div></div>
    </div>
  </div>

  <div class="split-hero-grid">
    <div class="split-card theory" onclick="go({view:'lesson', id:'${THEORY[0].id}'})">
      <div class="sc-eyebrow">Partie 1 · Théorie</div>
      <h2>Apprendre les concepts</h2>
      <p>Des variables au premier programme jusqu'aux génériques, delegates, async/await et records — chaque leçon combine explication, exemple de code commenté et points clés.</p>
      <div class="sc-stat">${total} leçons · 6 modules progressifs</div>
    </div>
    <div class="split-card practice" onclick="go({view:'practice'})">
      <div class="sc-eyebrow">Partie 2 · Pratique</div>
      <h2>S'entraîner et produire</h2>
      <p>Une banque de ${EXERCISES.length} exercices classés par difficulté avec indices et piste de correction, plus ${PROJECTS.length} mini-projets complets à réaliser sur plusieurs séances.</p>
      <div class="sc-stat">${EXERCISES.length} exercices · ${PROJECTS.length} projets</div>
    </div>
  </div>

  <div class="section-label">Programme théorique détaillé</div>
  <div class="track-grid">${tracks}</div>

  <div class="footer-note">Cours de C# généraliste (console, .NET), conçu pour un usage en classe : chaque leçon a une case « Marquer comme terminée » pour suivre la progression des élèves.</div>
  `;
}

/* ===================== LESSON ===================== */
function renderLesson(id){
  const idx = THEORY.findIndex(l=>l.id===id);
  const l = THEORY[idx];
  if(!l) return `<p>Leçon introuvable.</p>`;
  const prev = THEORY[idx-1], next = THEORY[idx+1];
  const done = !!state.progress[l.id];

  return `
  <div class="crumb"><a onclick="go({view:'home'})">Accueil</a> / ${escapeHtml(l.module)}</div>
  <div class="lesson-head">
    <div class="lesson-tag"><b>${escapeHtml(l.module)}</b> · Leçon ${idx+1} / ${THEORY.length} <span class="diff-badge ${l.difficulty}" style="margin-left:8px;">${l.difficulty}</span></div>
    <h1>${escapeHtml(l.title)}</h1>
    <div class="lesson-meta">
      <span class="time">⏱ ${l.minutes} min de lecture</span>
      <button class="mark-done-btn ${done?'is-done':''}" onclick="toggleDone('${l.id}')">${done? '✓ Leçon terminée' : 'Marquer comme terminée'}</button>
    </div>
  </div>

  <div class="theory">${renderTheory(l.theory)}</div>

  <div class="code-block">
    <div class="cb-head">
      <span class="cb-title">${escapeHtml(l.codeTitle)}</span>
      <span style="display:flex;align-items:center;">
        <span class="cb-lang">${l.codeLang}</span>
        <button class="copy-btn" onclick="copyCode(this)">Copier</button>
      </span>
    </div>
    <pre><code>${highlightCode(l.code, l.codeLang)}</code></pre>
  </div>

  <div class="keypoints">
    <div class="kp-label">À retenir</div>
    <ul>${l.keypoints.map(k=>`<li>${escapeHtml(k)}</li>`).join("")}</ul>
  </div>

  <div class="exercise-box">
    <div class="ex-label">✎ Exercice pratique</div>
    <p>${escapeHtml(l.exercise)}</p>
  </div>

  <div class="lesson-nav">
    ${prev ? `<div class="lesson-nav-btn" onclick="go({view:'lesson',id:'${prev.id}'})"><div class="dir">← Précédent</div><div class="ttl">${escapeHtml(prev.title)}</div></div>` : `<div></div>`}
    ${next ? `<div class="lesson-nav-btn next" onclick="go({view:'lesson',id:'${next.id}'})"><div class="dir">Suivant →</div><div class="ttl">${escapeHtml(next.title)}</div></div>` : `<div class="lesson-nav-btn next" onclick="go({view:'practice'})"><div class="dir">Suivant →</div><div class="ttl">Passer à la Partie Pratique</div></div>`}
  </div>
  `;
}

function copyCode(btn){
  const code = btn.closest('.code-block').querySelector('code').innerText;
  navigator.clipboard.writeText(code).then(()=>{
    const old = btn.innerText; btn.innerText = "Copié ✓";
    setTimeout(()=>btn.innerText=old, 1500);
  }).catch(()=>{});
}

/* ===================== PRATIQUE (hub) ===================== */
function allThemes(){
  const s = new Set();
  EXERCISES.forEach(e => e.themes.forEach(t=>s.add(t)));
  return [...s].sort();
}

function exFiltered(){
  return EXERCISES.filter(e => {
    if(state.exFilter.difficulty!=='all' && e.difficulty!==state.exFilter.difficulty) return false;
    if(state.exFilter.theme!=='all' && !e.themes.includes(state.exFilter.theme)) return false;
    return true;
  });
}

function renderPractice(){
  const exs = exFiltered();
  const themes = allThemes();
  return `
  <div class="crumb"><a onclick="go({view:'home'})">Accueil</a> / Partie Pratique</div>
  <div class="lesson-head">
    <div class="lesson-tag"><b>S'entraîner</b></div>
    <h1>Partie Pratique</h1>
    <p style="color:var(--text-mid);font-size:14.5px;max-width:680px;">Une banque d'exercices indépendants (avec indices et piste de correction) et des mini-projets complets à réaliser sur plusieurs séances, pour mettre en application la théorie.</p>
  </div>

  <div class="section-label">Mini-projets</div>
  <div>
    ${PROJECTS.map(p=>`
      <div class="proj-card" onclick="go({view:'project', id:'${p.id}'})">
        <div class="pc-top">
          <h3>${escapeHtml(p.title)}</h3>
          <span class="diff-badge Intermédiaire" style="background:rgba(212,167,61,.15);color:var(--gold-bright);">${escapeHtml(p.difficulty)}</span>
          <span class="pc-duration">⏱ ${escapeHtml(p.duration)}</span>
        </div>
        <p class="pdesc">${escapeHtml(p.description)}</p>
        <div class="pc-themes">${p.concepts.map(c=>`<span class="theme-chip">${escapeHtml(c)}</span>`).join("")}</div>
      </div>
    `).join("")}
  </div>

  <div class="section-label">Banque d'exercices <span style="color:var(--text-dim);font-weight:400;margin-left:6px;">(${exs.length}/${EXERCISES.length})</span></div>

  <div class="filter-row">
    <span class="chip ${state.exFilter.difficulty==='all'?'active':''}" onclick="setExDiff('all')">Toutes difficultés</span>
    <span class="chip ${state.exFilter.difficulty==='Débutant'?'active':''}" onclick="setExDiff('Débutant')">Débutant</span>
    <span class="chip ${state.exFilter.difficulty==='Intermédiaire'?'active':''}" onclick="setExDiff('Intermédiaire')">Intermédiaire</span>
    <span class="chip ${state.exFilter.difficulty==='Avancé'?'active':''}" onclick="setExDiff('Avancé')">Avancé</span>
  </div>
  <div class="filter-row">
    <span class="chip ${state.exFilter.theme==='all'?'active':''}" onclick="setExTheme('all')">Tous les thèmes</span>
    ${themes.map(t=>`<span class="chip ${state.exFilter.theme===t?'active':''}" onclick="setExTheme('${t.replace(/'/g,"\\'")}')">${escapeHtml(t)}</span>`).join("")}
  </div>

  <div>
    ${exs.map(e=>`
      <div class="ex-card" onclick="go({view:'exercise', id:'${e.id}'})">
        <div class="ex-top">
          <h3>${escapeHtml(e.title)}</h3>
          <span class="diff-badge ${e.difficulty}">${e.difficulty}</span>
        </div>
        <p class="stmt">${escapeHtml(e.statement.slice(0,140))}${e.statement.length>140?'…':''}</p>
        <div class="ex-themes">${e.themes.map(t=>`<span class="theme-chip">${escapeHtml(t)}</span>`).join("")}</div>
      </div>
    `).join("") || `<p style="color:var(--text-dim);font-size:13px;">Aucun exercice ne correspond à ces filtres.</p>`}
  </div>
  `;
}
function setExDiff(d){ state.exFilter.difficulty=d; renderMain(); }
function setExTheme(t){ state.exFilter.theme=t; renderMain(); }

function renderExercise(id){
  const e = EXERCISES.find(x=>x.id===id);
  if(!e) return `<p>Exercice introuvable.</p>`;
  const shown = !!state.revealed[id];
  return `
  <div class="crumb"><a onclick="go({view:'home'})">Accueil</a> / <a onclick="go({view:'practice'})">Partie Pratique</a></div>
  <div class="lesson-head">
    <div class="lesson-tag"><span class="diff-badge ${e.difficulty}">${e.difficulty}</span></div>
    <h1>${escapeHtml(e.title)}</h1>
    <div class="ex-themes" style="margin-top:8px;">${e.themes.map(t=>`<span class="theme-chip">${escapeHtml(t)}</span>`).join("")}</div>
  </div>

  <div class="theory"><p>${escapeHtml(e.statement)}</p></div>

  <div class="detail-section">
    <div class="ds-label">Indices</div>
    ${e.hints.map(h=>`<div class="hint-item">💡 ${escapeHtml(h)}</div>`).join("")}
  </div>

  <div class="detail-section">
    <button class="reveal-btn" onclick="toggleReveal('${id}')">${shown?'Masquer la piste de correction':'Afficher une piste de correction'}</button>
    <div class="solution-block ${shown?'shown':''}">
      <div class="code-block" style="margin-top:16px;">
        <div class="cb-head"><span class="cb-title">Piste de correction (une approche possible)</span><span class="cb-lang">C#</span></div>
        <pre><code>${highlightCode(e.solutionSketch, 'csharp')}</code></pre>
      </div>
    </div>
  </div>

  <div class="lesson-nav">
    <div class="lesson-nav-btn" onclick="go({view:'practice'})"><div class="dir">← Retour</div><div class="ttl">Tous les exercices</div></div>
    <div></div>
  </div>
  `;
}
function toggleReveal(id){ state.revealed[id] = !state.revealed[id]; renderMain(); }

function renderProject(id){
  const p = PROJECTS.find(x=>x.id===id);
  if(!p) return `<p>Projet introuvable.</p>`;
  return `
  <div class="crumb"><a onclick="go({view:'home'})">Accueil</a> / <a onclick="go({view:'practice'})">Partie Pratique</a></div>
  <div class="lesson-head">
    <div class="lesson-tag"><b>Mini-projet</b> · ${escapeHtml(p.difficulty)} · ⏱ ${escapeHtml(p.duration)}</div>
    <h1>${escapeHtml(p.title)}</h1>
    <div class="ex-themes" style="margin-top:8px;">${p.concepts.map(c=>`<span class="theme-chip">${escapeHtml(c)}</span>`).join("")}</div>
  </div>

  <div class="theory"><p>${escapeHtml(p.description)}</p></div>

  <div class="detail-section">
    <div class="ds-label">Cahier des charges</div>
    <ul class="req-list">${p.requirements.map(r=>`<li>${escapeHtml(r)}</li>`).join("")}</ul>
  </div>

  <div class="detail-section">
    <div class="ds-label">Pistes pour démarrer</div>
    ${p.hints.map(h=>`<div class="hint-item">💡 ${escapeHtml(h)}</div>`).join("")}
  </div>

  <div class="lesson-nav">
    <div class="lesson-nav-btn" onclick="go({view:'practice'})"><div class="dir">← Retour</div><div class="ttl">Tous les projets</div></div>
    <div></div>
  </div>
  `;
}

/* ===================== GLOSSAIRE ===================== */
function renderGlossaire(){
  return `
  <div class="crumb"><a onclick="go({view:'home'})">Accueil</a> / Glossaire</div>
  <div class="lesson-head">
    <div class="lesson-tag"><b>${GLOSSARY.length} termes</b></div>
    <h1>Glossaire</h1>
  </div>
  <div class="gloss-grid">
    ${GLOSSARY.map(g=>`<div class="gloss-item"><div class="g-term">${escapeHtml(g.terme)}</div><div class="g-def">${escapeHtml(g.def)}</div></div>`).join("")}
  </div>
  `;
}

/* ===================== ROUTER ===================== */
function renderMain(){
  const r = state.route;
  let html = "";
  if(r.view==='home') html = renderHome();
  else if(r.view==='lesson') html = renderLesson(r.id);
  else if(r.view==='practice') html = renderPractice();
  else if(r.view==='exercise') html = renderExercise(r.id);
  else if(r.view==='project') html = renderProject(r.id);
  else if(r.view==='glossaire') html = renderGlossaire();
  document.getElementById('main').innerHTML = html;
  updateProgressPill();
}
function updateProgressPill(){
  const total = THEORY.length;
  const done = Object.values(state.progress).filter(Boolean).length;
  const pill = document.getElementById('progressPill');
  if(pill) pill.innerHTML = `<b>${done}</b>/${total} leçons`;
}
function renderApp(){ renderSidebar(); renderMain(); }

/* ===================== GLOBAL SEARCH ===================== */
function openSearch(){
  document.getElementById('searchOverlay').classList.add('open');
  document.getElementById('globalSearchInput').value = '';
  document.getElementById('globalSearchInput').focus();
  renderSearchResults('');
}
function closeSearch(){ document.getElementById('searchOverlay').classList.remove('open'); }
function renderSearchResults(q){
  const ql = q.trim().toLowerCase();
  let results = [];
  THEORY.forEach(l=>{
    if(!ql || l.title.toLowerCase().includes(ql) || l.module.toLowerCase().includes(ql)){
      results.push({type:'Leçon', title:l.title, sub:l.module, action:()=>go({view:'lesson',id:l.id})});
    }
  });
  EXERCISES.forEach(e=>{
    if(!ql || e.title.toLowerCase().includes(ql)){
      results.push({type:'Exercice', title:e.title, sub:e.difficulty, action:()=>go({view:'exercise',id:e.id})});
    }
  });
  PROJECTS.forEach(p=>{
    if(!ql || p.title.toLowerCase().includes(ql)){
      results.push({type:'Projet', title:p.title, sub:p.difficulty, action:()=>go({view:'project',id:p.id})});
    }
  });
  results = results.slice(0,40);
  document.getElementById('searchResults').innerHTML = results.map((r,i)=>`
    <div class="search-result" data-i="${i}" onclick='(${r.action.toString()})();closeSearch();'>
      <div class="sr-title">${escapeHtml(r.title)}</div>
      <div class="sr-sub">${r.type} · ${escapeHtml(r.sub)}</div>
    </div>
  `).join("") || `<div style="padding:20px;color:var(--text-dim);font-size:13px;">Aucun résultat.</div>`;
}

/* ===================== THEME ===================== */
function toggleTheme(){
  document.body.classList.toggle('light');
  try{
    if(window.storage) window.storage.set('csharp-course-theme', document.body.classList.contains('light')?'light':'dark', false);
  }catch(e){}
}
async function loadTheme(){
  try{
    if(window.storage){
      const r = await window.storage.get('csharp-course-theme', false);
      if(r && r.value === 'light') document.body.classList.add('light');
    }
  }catch(e){}
}

/* ===================== INIT ===================== */
document.addEventListener('DOMContentLoaded', async ()=>{
  await loadTheme();
  document.getElementById('menuToggle').addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.toggle('open');
  });
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
  document.getElementById('searchTrigger').addEventListener('click', openSearch);
  document.getElementById('searchOverlay').addEventListener('click', (e)=>{
    if(e.target.id==='searchOverlay') closeSearch();
  });
  document.getElementById('globalSearchInput').addEventListener('input', (e)=>renderSearchResults(e.target.value));
  document.addEventListener('keydown', (e)=>{
    if((e.metaKey||e.ctrlKey) && e.key==='k'){ e.preventDefault(); openSearch(); }
    if(e.key==='Escape') closeSearch();
  });
  renderApp();
  await loadProgress();
});
</script>
</body></html>
