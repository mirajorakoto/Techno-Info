<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Praxis ML — Apprendre le Machine Learning de zéro à expert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4ef; --bg2:#fdfdfb; --bg3:#e9ede5; --ink:#14201a; --mut:#5d6e64; --line:#d8ded4;
  --c-ml:#0f8a5f; --c-py:#c07a08; --c-math:#0f7bb0; --c-dl:#c22f57; --env:#6b7280;
  --code-bg:#0f1a15; --code-ink:#d8e6dd;
  --shadow:0 1px 2px rgba(20,32,26,.05),0 8px 24px -12px rgba(20,32,26,.14);
  --grid:rgba(20,32,26,.045);
}
html[data-theme="dark"]{
  --bg:#0c120f; --bg2:#131b16; --bg3:#1a241e; --ink:#e9f0ea; --mut:#98a89d; --line:#26332b;
  --c-ml:#3dd68f; --c-py:#f0b23e; --c-math:#4db8e8; --c-dl:#f4738f; --env:#9aa5ad;
  --code-bg:#0a120e; --code-ink:#cfe0d5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  --grid:rgba(233,240,234,.035);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:34px 34px}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
h1,h2,h3,h4,.num,.lvl-n{font-family:'Space Grotesk',sans-serif}
code,pre,.mono{font-family:'IBM Plex Mono',monospace}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--c-ml);color:#fff}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:262px 1fr;min-height:100vh;position:relative;z-index:1}
main{min-width:0}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:12px 28px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink)}
.tb-title{font-family:'Space Grotesk';font-weight:600;font-size:15px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;flex:1;max-width:430px;margin-left:auto}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--ink);font:inherit;font-size:14px;outline:none;transition:.2s}
.search input:focus{border-color:var(--c-ml);box-shadow:0 0 0 3px color-mix(in srgb,var(--c-ml) 18%,transparent)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5}
#searchDrop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:380px;overflow:auto;padding:6px}
#searchDrop .sg{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:8px 10px 3px}
#searchDrop .si{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
#searchDrop .si:hover{background:var(--bg3)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--bg2);font-size:13px;font-weight:600;white-space:nowrap}
.pill b{color:var(--c-ml)}
#overlay{position:fixed;inset:0;background:rgba(10,16,12,.45);z-index:55;opacity:0;pointer-events:none;transition:.25s}
body.nav-open #overlay{opacity:1;pointer-events:auto}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;z-index:60}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px}
.brand .mark{width:40px;height:40px;border-radius:11px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.brand .bt{font-family:'Space Grotesk';font-weight:700;font-size:17px;letter-spacing:.01em;line-height:1.1}
.brand .bs{font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:500;color:var(--mut);position:relative;transition:.18s}
.nav a svg{flex:none;opacity:.75}
.nav a:hover{background:var(--bg3);color:var(--ink)}
.nav a.on{background:color-mix(in srgb,var(--c-ml) 11%,transparent);color:var(--ink);font-weight:600}
.nav a.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--c-ml)}
.nav a .cnt{margin-left:auto;font-size:11px;font-weight:600;background:var(--bg3);border-radius:99px;padding:1px 7px;color:var(--mut)}
.side-foot{padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.theme-btn{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:13.5px;font-weight:500;color:var(--ink)}
.theme-btn:hover{border-color:var(--c-ml)}
.side-note{font-size:11px;color:var(--mut);padding:0 6px;line-height:1.45}
.view{padding:34px 34px 90px;max-width:1180px;margin:auto}
.kicker{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--c-ml)}
.h1{font-size:clamp(28px,3.6vw,42px);line-height:1.08;font-weight:700;letter-spacing:-.015em}
.h2{font-size:23px;font-weight:700;letter-spacing:-.01em;margin-bottom:14px}
.sub{color:var(--mut);max-width:62ch}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:20px}
.sec{margin-top:44px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.sec-head .h2{margin:0}
.sec-head .lnk{margin-left:auto;font-size:13.5px;font-weight:600;color:var(--c-ml);background:none;border:none;text-decoration:none}
.sec-head .lnk:hover{text-decoration:underline}
.hero{display:grid;grid-template-columns:1.15fr .95fr;gap:28px;align-items:center;margin-bottom:8px}
.hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 22px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1px solid var(--line);border-radius:99px;font-size:12.5px;font-weight:600;background:var(--bg2)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--pc,var(--c-ml))}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:11px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:600;font-size:14.5px;text-decoration:none;transition:.18s;cursor:pointer}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--bg3)}
.btn.sm{padding:8px 14px;font-size:13.5px;border-radius:9px}
.console{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--bg2);box-shadow:var(--shadow)}
.console .chd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;font-family:'IBM Plex Mono';color:var(--mut)}
.console .chd i{width:9px;height:9px;border-radius:50%;display:inline-block}
.console canvas{width:100%;height:230px;display:block}
.console .cft{display:flex;justify-content:space-between;padding:9px 14px;font-size:12px;font-family:'IBM Plex Mono';color:var(--mut);border-top:1px solid var(--line)}
.console .cft b{color:var(--c-ml)}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.statband{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px}
.stat{padding:18px 20px;position:relative;overflow:hidden;transition:.2s}
.stat:hover{transform:translateY(-3px)}
.stat .num{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}
.stat .lb{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:6px;font-weight:600}
.stat::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:3px;background:var(--pc,var(--c-ml));opacity:.85}
.bar{height:8px;border-radius:99px;background:var(--bg3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pc,var(--c-ml));width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.bar.lg{height:11px}
.pillars{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px}
.pcard{padding:20px;position:relative;overflow:hidden;transition:.2s}
.pcard:hover{transform:translateY(-3px)}
.pcard::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--pc)}
.pcard .pt{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:700;font-size:16px}
.pcard .pt .pic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--pc) 14%,transparent);color:var(--pc)}
.pcard .pct{font-family:'Space Grotesk';font-weight:700;font-size:26px;margin:14px 0 6px}
.pcard .nx{font-size:13px;color:var(--mut);margin-top:12px}
.pcard .nx a{color:var(--pc);font-weight:600;text-decoration:none}
.pcard .nx a:hover{text-decoration:underline}
.pcard ul{list-style:none;margin-top:10px;font-size:13px;color:var(--mut)}
.pcard ul li{padding:4px 0 4px 18px;position:relative}
.pcard ul li::before{content:"▸";position:absolute;left:2px;color:var(--pc)}
.lvlstrip{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 14px;scrollbar-width:thin}
.lvlchip{flex:none;width:122px;border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:12px;cursor:pointer;transition:.18s;position:relative}
.lvlchip:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--c-ml)}
.lvlchip .n{font-family:'Space Grotesk';font-weight:700;font-size:20px}
.lvlchip .t{font-size:11.5px;color:var(--mut);line-height:1.3;margin-top:2px;min-height:30px}
.lvlchip .bar{margin-top:8px}
.lvlchip.done .n{color:var(--c-ml)}
.flow{display:flex;flex-wrap:wrap;gap:0;align-items:center;margin-top:8px}
.flow .st{display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:var(--bg2);font-size:13px;font-weight:600}
.flow .ar{color:var(--mut);padding:0 6px}
.lane-hd{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.lane-hd .lh{display:flex;align-items:center;gap:9px;font-weight:700;font-family:'Space Grotesk';font-size:15px;padding:10px 14px;border-radius:11px;background:color-mix(in srgb,var(--pc) 10%,transparent);color:var(--pc);border:1px solid color-mix(in srgb,var(--pc) 30%,transparent)}
.lane-hd .lh small{font-weight:500;color:var(--mut);font-family:'IBM Plex Sans';font-size:12px}
.level-block{position:relative;padding:22px 0 26px 66px;border-top:1px dashed var(--line)}
.level-block .lvnum{position:absolute;left:0;top:22px;width:46px;height:46px;border-radius:13px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:19px}
.level-block .lvnum small{font-size:9px;letter-spacing:.1em;display:block;text-align:center;opacity:.7;font-weight:500}
.level-block .lvnum span{line-height:1}
.level-block .lt{font-family:'Space Grotesk';font-weight:700;font-size:19px}
.level-block .ld{color:var(--mut);font-size:14px;margin:3px 0 16px;max-width:70ch}
.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.lane{display:flex;flex-direction:column;gap:9px}
.lcard{display:block;text-align:left;width:100%;background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:11px;padding:11px 13px;transition:.18s;position:relative}
.lcard:hover{transform:translateX(4px);box-shadow:var(--shadow)}
.lcard .tt{font-weight:600;font-size:13.8px;line-height:1.35;display:flex;gap:8px;align-items:flex-start}
.lcard .mt{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;align-items:center}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:99px;text-transform:uppercase}
.tag.full{background:color-mix(in srgb,var(--c-ml) 15%,transparent);color:var(--c-ml)}
.tag.syn{background:var(--bg3);color:var(--mut)}
.tag.dur{background:transparent;border:1px solid var(--line);color:var(--mut);text-transform:none;font-weight:500}
.chk{width:17px;height:17px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center;font-size:10px;color:#fff;transition:.2s}
.lcard.isdone .chk{background:var(--c-ml);border-color:var(--c-ml)}
.lcard.isdone .tt{opacity:.72}
.lane-empty{border:1px dashed var(--line);border-radius:11px;padding:14px;font-size:12.5px;color:var(--mut);text-align:center}
.lhero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
.lhero .meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.lhero h1{font-size:clamp(24px,3vw,34px);letter-spacing:-.01em}
.lsec{margin-top:38px;scroll-margin-top:90px}
.lsec>.stt{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.lsec>.stt .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--pc,var(--c-ml)) 14%,transparent);color:var(--pc,var(--c-ml));flex:none}
.lsec>.stt h2{font-size:19px;font-weight:700}
.lsec .bd{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.lsec .bd h4{font-size:15px;margin:16px 0 6px;color:var(--c-ml)}
.lsec .bd h4:first-child{margin-top:0}
.lsec .bd p{margin:8px 0}
.lsec .bd ul,.lsec .bd ol{margin:8px 0 8px 22px}
.lsec .bd li{margin:5px 0}
.lsec .bd table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}
.lsec .bd th,.lsec .bd td{border:1px solid var(--line);padding:8px 11px;text-align:left}
.lsec .bd th{background:var(--bg3);font-family:'Space Grotesk';font-size:13px}
.callout{border-left:4px solid var(--cc,var(--c-ml));background:color-mix(in srgb,var(--cc,var(--c-ml)) 7%,transparent);border-radius:0 11px 11px 0;padding:13px 16px;margin:14px 0;font-size:14.5px}
.callout.warn{--cc:var(--c-py)}
.callout.danger{--cc:var(--c-dl)}
.callout b.t{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;color:var(--cc,var(--c-ml))}
.formula{background:var(--bg3);border:1px solid var(--line);border-radius:11px;padding:14px 18px;font-family:'IBM Plex Mono';font-size:15px;text-align:center;margin:12px 0;overflow-x:auto}
.objgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.linkrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.pchip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:600;border:1px solid color-mix(in srgb,var(--pc) 35%,transparent);background:color-mix(in srgb,var(--pc) 9%,transparent);color:var(--pc);cursor:pointer;transition:.15s}
.pchip:hover{transform:translateY(-2px)}
.code{border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08);margin:14px 0;background:var(--code-bg)}
.code-hd{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.07)}
.code-hd span{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7fa392}
.copy{background:transparent;border:1px solid rgba(255,255,255,.16);color:#bcd6c8;font-size:11.5px;padding:3px 10px;border-radius:7px;transition:.15s}
.copy:hover{background:rgba(255,255,255,.1)}
.copy.ok{border-color:#3dd68f;color:#3dd68f}
.code pre{padding:15px 17px;overflow-x:auto;font-size:13.3px;line-height:1.65;color:var(--code-ink)}
.tok-k{color:#6ee7a8;font-weight:600}.tok-s{color:#f0c674}.tok-c{color:#6d8578;font-style:italic}.tok-n{color:#82c7f0}
.out{border:1px dashed var(--line);border-radius:11px;background:var(--bg3);padding:12px 16px;font-family:'IBM Plex Mono';font-size:13px;margin:6px 0 14px;color:var(--mut);white-space:pre-wrap}
.out::before{content:"▸ Résultat attendu";display:block;font-family:'IBM Plex Sans';font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--c-ml);margin-bottom:5px}
.expl-toggle{background:none;border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);margin:6px 0}
.expl-toggle:hover{border-color:var(--c-ml);color:var(--c-ml)}
.expl-list{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin:8px 0}
.expl-list .er{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:9px 13px;border-top:1px solid var(--line);font-size:13.5px}
.expl-list .er:first-child{border-top:none}
.expl-list .er:nth-child(odd){background:var(--bg3)}
.expl-list .er b{font-family:'IBM Plex Mono';color:var(--c-ml);font-weight:600}
.quiz{border:1px solid var(--line);border-radius:13px;background:var(--bg2);padding:18px 20px;margin:12px 0}
.quiz .qq{font-weight:600;font-size:15px;display:flex;gap:10px}
.quiz .qq .qtag{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:3px 9px;border-radius:99px;background:var(--bg3);color:var(--mut);height:fit-content;text-transform:uppercase}
.quiz .opts{display:flex;flex-direction:column;gap:8px;margin-top:13px}
.opt{display:flex;align-items:center;gap:11px;text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:14px;transition:.15s;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--c-ml);transform:translateX(3px)}
.opt .k{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:12px;flex:none}
.opt.good{background:color-mix(in srgb,var(--c-ml) 13%,transparent);border-color:var(--c-ml);animation:pop .35s}
.opt.good .k{background:var(--c-ml);color:#fff;border-color:var(--c-ml)}
.opt.bad{background:color-mix(in srgb,var(--c-dl) 12%,transparent);border-color:var(--c-dl);animation:shake .4s}
.opt.bad .k{background:var(--c-dl);color:#fff;border-color:var(--c-dl)}
.opt:disabled{cursor:default}
@keyframes pop{50%{transform:scale(1.02)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.qfb{margin-top:13px;border-radius:11px;padding:14px 16px;font-size:14px;background:var(--bg3);border:1px solid var(--line);animation:fadein .4s}
.qfb .v{font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.qfb .v.ok{color:var(--c-ml)}.qfb .v.ko{color:var(--c-dl)}
.qfb .why{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--mut)}
.qfb .why li{margin:4px 0 4px 18px}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.viz{border:1px solid var(--line);border-radius:14px;background:var(--bg2);overflow:hidden;margin:16px 0}
.viz .vhd{display:flex;align-items:center;gap:10px;padding:10px 15px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--mut);font-family:'IBM Plex Mono'}
.viz .vhd i{width:8px;height:8px;border-radius:50%;background:var(--c-ml);animation:blink 1.6s steps(1) infinite}
.viz canvas{width:100%;display:block}

<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function hl(src,lang){
  let s=esc(src);
  if(lang==="bash") return s.replace(/(^|\n)(#[^\n]*)/g,'$1<span class="tok-c">$2</span>')
    .replace(/\b(pip|python|python3|git|docker|jupyter|cd|mkdir|ls|source)\b/g,'<span class="tok-k">$1</span>');
  return s
    .replace(/("""[\s\S]*?"""|"[^"\n]*"|'[^'\n]*')/g,'<span class="tok-s">$1</span>')
    .replace(/\b(import|from|def|return|for|while|if|elif|else|in|not|and|or|True|False|None|class|with|as|lambda|try|except|range|len|print|type|int|float|str|bool|input)\b/g,'<span class="tok-k">$1</span>')
    .replace(/\b(\d+\.?\d*)\b/g,'<span class="tok-n">$1</span>');
}
function codeBlock(src,lang,label){
  return `<div class="code"><div class="code-hd"><span>${label||lang||"python"}</span><button class="copy" data-raw="${encodeURIComponent(src)}">Copier</button></div><pre><code>${hl(src,lang)}</code></pre></div>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest(".copy"); if(!b)return;
  navigator.clipboard.writeText(decodeURIComponent(b.dataset.raw));
  b.textContent="Copié ✓"; b.classList.add("ok"); setTimeout(()=>{b.textContent="Copier";b.classList.remove("ok")},1500);
});
const LS="praxisml_v1";

const PIL={
  ml:{n:"Machine Learning",c:"var(--c-ml)"},
  py:{n:"Python & Programmation",c:"var(--c-py)"},
  math:{n:"Mathématiques",c:"var(--c-math)"},
  env:{n:"Environnement & Outils",c:"var(--env)"}
};

/* ================= LEÇONS ================= */
const L={};
L["env-decouverte"]={t:`L'ordinateur, les fichiers et le terminal`,l:0,p:"env",d:`25 min`,
 obj:[`Se repérer dans les fichiers et dossiers de son ordinateur`,`Ouvrir un terminal et utiliser les commandes essentielles (cd, ls, mkdir)`,`Comprendre pourquoi le terminal est indispensable en ML`],
 pre:[],
 th:`<p>Avant de programmer, il faut savoir <b>où l'on range ses fichiers</b> et comment y accéder. En machine learning, vous manipulerez des dizaines de datasets, de scripts et de modèles : une organisation rigoureuse est votre premier outil.</p>
 <p>Le <b>terminal</b> est une télécommande textuelle pour l'ordinateur. Au lieu de cliquer dans des dossiers, on tape une commande. C'est ainsi qu'on installe Python, qu'on lance des entraînements et qu'on utilise Git.</p>
 <table><tr><th>Commande</th><th>Effet</th></tr><tr><td><code>cd mon_dossier</code></td><td>entrer dans un dossier</td></tr><tr><td><code>cd ..</code></td><td>remonter d'un niveau</td></tr><tr><td><code>ls</code> (Mac/Linux) / <code>dir</code> (Windows)</td><td>lister le contenu</td></tr><tr><td><code>mkdir projet</code></td><td>créer un dossier</td></tr><tr><td><code>pwd</code></td><td>afficher le dossier courant</td></tr></table>
 <div class="callout"><b class="t">Habitude d'expert</b>Créez un dossier racine unique, par exemple <code>~/ml-projects/</code>, avec un sous-dossier par projet. Vous ne chercherez jamais un fichier.</div>`,
 quiz:[{type:"qcm",q:`Quelle commande permet d'entrer dans le dossier <code>data</code> ?`,o:[`ls data`,`cd data`,`mkdir data`],g:1,
 e:`<code>cd</code> (change directory) déplace le terminal dans le dossier indiqué.`,w:[`<code>ls</code> liste le contenu mais n'y entre pas.`,`<code>mkdir</code> crée un dossier, il n'y entre pas.`]}],
 sk:[`Naviguer dans l'arborescence`,`Utiliser cd, ls, mkdir`],res:[`Le terminal remplace la souris pour tout ce qui est technique`,`Un dossier par projet, toujours`],nx:[`py-decouverte`,`Votre premier code Python s'écrit dans un fichier, quelque part dans un dossier.`]};

L["py-decouverte"]={t:`Python découverte : variables, types et print`,l:0,p:"py",d:`45 min`,full:1,
 obj:[`Créer et modifier des variables`,`Distinguer int, float, str et bool`,`Afficher un résultat avec print() et demander une valeur avec input()`,`Lire le type d'une valeur avec type()`],
 pre:[`env-decouverte`],
 th:`<p>Python est le langage du machine learning : NumPy, Pandas, scikit-learn et PyTorch sont tous écrits pour lui. Bonne nouvelle : c'est aussi l'un des plus simples à apprendre.</p>
 <h4>Une variable = une boîte avec une étiquette</h4>
 <p>Quand vous écrivez <code>age = 25</code>, vous collez l'étiquette <code>age</code> sur la valeur <code>25</code>. Plus tard, <code>age</code> vous redonne cette valeur. En ML, chaque <b>feature</b> d'un dataset est exactement cela : une colonne avec un nom et des valeurs.</p>
 <h4>Les 4 types de base</h4>
 <table><tr><th>Type</th><th>Exemple</th><th>Usage ML</th></tr><tr><td><code>int</code></td><td><code>25</code></td><td>âge, quantité</td></tr><tr><td><code>float</code></td><td><code>19.99</code></td><td>prix, température, poids d'un modèle</td></tr><tr><td><code>str</code></td><td><code>"Ada"</code></td><td>texte, catégories</td></tr><tr><td><code>bool</code></td><td><code>True</code></td><td>oui/non, 0/1</td></tr></table>`,
 int:`<p>Imaginez une fiche de renseignements : nom, âge, taille, « est étudiant ? ». Chaque case a un type différent. Un dataset ML n'est rien d'autre qu'un empilement de ces fiches — et Python sait déjà manipuler chaque case individuellement.</p>`,
 py:{code:`# Mes premières variables
age = 25                  # int   : nombre entier
prix = 19.99              # float : nombre à virgule
nom = "Ada"               # str   : texte (entre guillemets)
est_etudiant = True       # bool  : vrai ou faux

print(nom, "a", age, "ans")
print("Type de prix :", type(prix))

age = age + 1             # on met à jour la variable
print("Année prochaine :", age)`,
 out:`Ada a 25 ans
Type de prix : <class 'float'>
Année prochaine : 26`,
 expl:[[1,`Un commentaire : Python l'ignore, il sert aux humains.`],[2,`Crée la variable <code>age</code> contenant l'entier 25.`],[3,`<code>prix</code> contient un nombre à virgule (float). Attention : point, pas virgule.`],[4,`Une chaîne de caractères, toujours entre guillemets.`],[5,`Un booléen : <code>True</code> ou <code>False</code> (majuscule obligatoire).`],[7,`<code>print</code> affiche plusieurs valeurs séparées par des espaces.`],[8,`<code>type()</code> révèle le type d'une valeur.`],[10,`On recalcule et on range le résultat dans la même variable : l'étiquette se déplace.`]]},
 ml:`<p>En ML, on ne programme pas les règles : on fournit des <b>données</b>. Mais pour décrire ces données, on utilise exactement ce que vous venez d'apprendre. La suite logique : stocker plusieurs valeurs ensemble (listes) puis dans des tableaux (NumPy).</p>`,
 ex:`<p>Le dataset <b>Iris</b> (le « bonjour » du ML) décrit 150 fleurs avec 4 mesures float et 1 nom d'espèce str. Vous savez déjà décrire chaque ligne !</p>`,
 quiz:[
  {type:"qcm",q:`Après <code>x = "5"</code>, quel est le type de <code>x</code> ?`,o:[`int`,`str`,`float`],g:1,e:`Les guillemets créent toujours du texte, même avec des chiffres.`,w:[`Sans guillemets, oui — mais ici il y en a.`,`Pas de guillemets et un point décimal auraient donné un float.`]},
  {type:"qcm",q:`Que vaut <code>type(3.0)</code> ?`,o:[`<class 'int'>`,`<class 'float'>`,`<class 'str'>`],g:1,e:`Le <code>.0</code> indique un nombre à virgule flottante, même si la valeur est entière.`,w:[`<code>3</code> sans point serait un int.`,`Rien n'est entre guillemets.`]},
  {type:"vf",q:`<code>Age = 25</code> et <code>age = 30</code> sont la même variable.`,o:[`Vrai`,`Faux`],g:1,e:`Python distingue majuscules et minuscules : ce sont deux variables différentes.`,w:[`Non : la casse fait partie du nom.`]}],
 mp:{n:`Carte d'identité d'un dataset`,d:`Créez des variables décrivant le dataset Iris (<code>nb_lignes = 150</code>, <code>nb_features = 4</code>, <code>nom = "iris"</code>, <code>est_classe = True</code>), puis affichez une phrase récapitulative avec un seul <code>print</code>.`,ch:`Ajoutez une variable <code>features</code> contenant la liste des noms de colonnes (on verra les listes juste après).`},
 res:[`Une variable est une étiquette sur une valeur`,`4 types de base : int, float, str, bool`,`print() affiche, type() renseigne, input() demande`],
 sk:[`Créer et mettre à jour des variables`,`Reconnaître les types de base`,`Afficher et convertir des valeurs`],
 liens:[[`env-decouverte`,`Terminal`],[`ml-donnees`,`Dataset & features`]],
 nx:[`m-nombres`,`Les nombres et leurs opérations sont la matière première de tous les calculs du ML.`]};

L["m-nombres"]={t:`Nombres, fractions, puissances et logarithmes`,l:0,p:"math",d:`40 min`,full:1,
 obj:[`Manipuler fractions, puissances et racines`,`Comprendre ce que fait un logarithme`,`Savoir pourquoi ces outils reviennent sans cesse en ML`],
 pre:[],
 th:`<p>Pas de panique : tout ici se calcule avec un stylo. Nous construisons uniquement les outils qui serviront plus tard.</p>
 <h4>Fractions et pourcentages</h4><p>Une fraction est une division : <code>3/4 = 0,75 = 75 %</code>. En ML, l'accuracy d'un modèle (« 87 % de bonnes réponses ») est exactement cela : <b>bonnes prédictions ÷ total</b>.</p>
 <h4>Puissances</h4><p><code>2³ = 2 × 2 × 2 = 8</code>. Le petit nombre indique combien de fois on multiplie. Le MSE (erreur quadratique, niveau 4) élève les erreurs au carré pour pénaliser les grandes erreurs.</p>
 <h4>Logarithme : l'opération inverse</h4><p>Le logarithme répond à la question : « 10 élevé à quelle puissance donne ce nombre ? » → <code>log₁₀(1000) = 3</code>. Il <b>écrase les grandes valeurs</b> : c'est lui qu'on utilise dans la loss logistique et l'entropie des arbres de décision.</p>`,
 int:`<p>Le logarithme est une échelle de Richter : passer de 1 à 10 « compte » autant que passer de 1000 à 10 000. Quand un modèle compare des probabilités minuscules (0,0001), le log évite les nombres illisibles.</p>`,
 maths:`<div class="formula">a^n = a × a × … × a &nbsp;&nbsp;|&nbsp;&nbsp; log(x) = y ⟺ e^y = x &nbsp;&nbsp;|&nbsp;&nbsp; √x = x^(1/2)</div>
 <p>Exemple numérique : <code>2⁴ = 16</code>, donc <code>log₂(16) = 4</code>. Et <code>ln(e) = 1</code> car <code>e¹ = e ≈ 2,718</code> — ce <code>e</code> reviendra dans la fonction sigmoïde.</p>`,
 py:{code:`print(3/4)        # fraction -> 0.75
print(2**10)      # puissance : 1024

L["ia-ml-dl"]={t:`IA, Machine Learning, Deep Learning : la grande famille`,l:1,p:"ml",d:`35 min`,full:1,
 obj:[`Expliquer avec ses mots la différence entre IA, ML et Deep Learning`,`Reconnaître des exemples réels de chaque niveau`,`Comprendre le changement de paradigme : règles apprises vs règles écrites`],
 pre:[`py-decouverte`,`m-nombres`],
 th:`<p>Trois cercles emboîtés :</p>
 <ul><li><b>Intelligence Artificielle (IA)</b> : tout programme capable d'une tâche « intelligente » — y compris avec des règles écrites à la main (un échiquier des années 1990 est une IA).</li>
 <li><b>Machine Learning (ML)</b> : le sous-ensemble où la machine <b>apprend des données</b> au lieu de recevoir des règles. On lui montre des exemples, elle en déduit le motif.</li>
 <li><b>Deep Learning (DL)</b> : le sous-ensemble du ML qui utilise des <b>réseaux de neurones artificiels</b> à plusieurs couches. C'est lui qui reconnaît les visages et traduit les langues.</li></ul>
 <h4>Le changement de paradigme</h4>
 <table><tr><th></th><th>Entrée</th><th>Sortie</th></tr><tr><td><b>Programme classique</b></td><td>données + <b>règles</b> écrites par l'humain</td><td>réponses</td></tr><tr><td><b>Machine Learning</b></td><td>données + <b>réponses</b> (exemples)</td><td>règles (le modèle)</td></tr></table>
 <p>Repères : 1950, Turing pose la question « les machines pensent-elles ? » · 1997, Deep Blue bat Kasparov (IA à règles) · 2012, AlexNet explose la reconnaissance d'images (début du DL moderne) · 2022+, les grands modèles de langage grand public.</p>`,
 int:`<p><b>Le filtre anti-spam.</b> Version classique : vous écrivez des règles (« si le mail contient GAGNER, spam »). Les escrocs changent leurs mots, vos règles deviennent obsolètes. Version ML : on montre à la machine 10 000 mails déjà étiquetés spam/non-spam ; elle découvre elle-même les indices — et s'adapte. C'est exactement ce renversement : <i>on ne programme plus la règle, on entraîne un modèle</i>.</p>`,
 py:{code:`def est_spam(mail):
    if "gagner" in mail or "gratuit" in mail:
        return True
    return False`},
 pyExpl:[[2,`La version « règles » : des <code>if</code> écrits à la main. La version ML remplacera ce <code>if</code> par <code>modele.predict(mail)</code> — un modèle entraîné sur des exemples. Tout le niveau 4 construit ce remplacement.`]],
 maths:`<p>Aucune formule pour l'instant — mais notez-le : le ML transforme un problème du monde réel en <b>problème d'optimisation numérique</b> (« trouver les nombres qui minimisent l'erreur »). Les maths arrivent pile au moment où elles servent, au niveau 3.</p>`,
 ex:`<p>Recommandations Netflix (ML), déverrouillage facial (DL), traduction automatique (DL), scoring bancaire (ML classique), joueur de Go AlphaGo (DL + renforcement).</p>`,
 quiz:[
  {type:"qcm",q:`Un filtre anti-spam qui apprend de mails étiquetés est…`,o:[`de l'IA symbolique à règles`,`du Machine Learning`,`une simple boucle while`],g:1,e:`Il apprend des exemples au lieu d'appliquer des règles écrites : c'est la définition du ML.`,w:[`L'IA symbolique applique des règles explicites — l'opposé de l'apprentissage.`,`Une boucle ne « apprend » rien du tout.`]},
  {type:"vf",q:`Le Deep Learning est un sous-ensemble du Machine Learning.`,o:[`Vrai`,`Faux`],g:0,e:`Oui : tout DL est du ML, mais tout ML n'est pas du DL (ex. régression linéaire).`,w:[`Regardez les cercles emboîtés : DL ⊂ ML ⊂ IA.`]},
  {type:"qcm",q:`Dans l'approche ML, on fournit à la machine :`,o:[`des règles et on attend des données`,`des données et des réponses attendues`,`uniquement des mathématiques`],g:1,e:`Données + étiquettes → la machine en déduit les règles (le modèle).`,w:[`C'est l'inverse : c'est le programme classique.`,`Les maths sont l'outil, pas la matière première.`]}],
 mp:{n:`Classez 6 technologies`,d:`Pour chaque exemple (voiture autonome, thermostat programmable, recommandation YouTube, correcteur orthographique à dictionnaire, ChatGPT, calculatrice), indiquez : IA à règles, ML ou DL. Justifiez en une phrase.`,ch:`Trouvez un exemple qui combine les trois.`},
 res:[`IA ⊃ ML ⊃ DL`,`ML = apprendre des données plutôt que programmer des règles`,`On fournit données + réponses, on récupère un modèle`],
 sk:[`Situer IA / ML / DL`,`Identifier un problème de ML`,`Expliquer le paradigme données → règles`],
 liens:[[`py-decouverte`,`Le if/else classique`],[`m-nombres`,`Premiers calculs`]],
 nx:[`m-fonctions`,`Un modèle ML est une fonction : comprenons cet objet mathématique avant de l'entraîner.`]};

L["m-fonctions"]={t:`Les fonctions : la brique de tout modèle`,l:1,p:"math",d:`35 min`,
 obj:[`Lire et tracer f(x) = ax + b`,`Comprendre entrée → sortie`,`Faire le lien : un modèle ML est une fonction`],pre:[`m-nombres`],
 th:`<p>Une fonction est une machine : on entre un nombre, il en ressort un autre, toujours de la même façon. <code>f(x) = 2x + 1</code> transforme 3 en 7. En ML, un <b>modèle est une fonction</b> : entrée = les features, sortie = la prédiction, et les coefficients (a, b) sont justement ce que l'entraînement va régler.</p><p>La forme <code>y = ax + b</code> est une droite : <code>a</code> est la pente (combien y augmente quand x augmente de 1), <code>b</code> l'ordonnée à l'origine. C'est littéralement le modèle du niveau 4 (régression linéaire).</p>`,
 quiz:[{type:"qcm",q:`Si f(x) = 3x − 2, que vaut f(4) ?`,o:[`10`,`14`,`7`],g:0,e:`3 × 4 − 2 = 10.`,w:[`Vous avez oublié le −2 ? Recalculez : 12 − 2.`,`3 × 4 + 2 donnerait 14 : mauvais signe.`]}],
 sk:[`Évaluer une fonction en un point`,`Interpréter pente et ordonnée à l'origine`],res:[`Un modèle = une fonction dont on règle les coefficients`],nx:[`py-listes`,`Un dataset contient beaucoup d'exemples : il faut des structures pour les stocker.`]};

L["py-listes"]={t:`Listes, tuples et dictionnaires`,l:1,p:"py",d:`50 min`,
 obj:[`Créer et parcourir listes, tuples et dictionnaires`,`Choisir la bonne structure selon le besoin`,`Préparer le terrain pour NumPy et Pandas`],pre:[`py-decouverte`],
 th:`<p>Une <b>liste</b> (<code>[10, 20, 30]</code>) stocke plusieurs valeurs dans l'ordre — c'est l'ancêtre du tableau NumPy. Un <b>tuple</b> (<code>(10, 20)</code>) est une liste non modifiable. Un <b>dictionnaire</b> (<code>{"age": 25, "ville": "Paris"}</code>) associe des clés à des valeurs — c'est l'ancêtre d'une ligne de dataset ou d'un fichier JSON d'API.</p>
 ${codeBlock(`notes = [12, 15, 9, 18]          # liste
eleve = {"nom": "Ada", "moyenne": 13.5}  # dictionnaire

print(eleve["nom"])              # accès par clé
notes.append(17)                 # ajout
print(sum(notes)/len(notes))     # moyenne : 14.2`)}`,
 quiz:[{type:"qcm",q:`Que renvoie <code>len([4, 8, 15, 16])</code> ?`,o:[`16`,`4`,`3`],g:1,e:`len compte le nombre d'éléments : 4.`,w:[`16 est la valeur du dernier élément.`,`L'index du dernier est 3, mais len compte les éléments.`]}],
 sk:[`Manipuler listes et dictionnaires`,`Accéder par index et par clé`],res:[`Liste = collection ordonnée ; dict = association clé→valeur`],nx:[`py-boucles`,`Pour traiter un dataset entier, il faut automatiser la répétition.`]};

L["py-boucles"]={t:`Conditions et boucles : automatiser`,l:2,p:"py",d:`50 min`,
 obj:[`Écrire if / elif / else`,`Répéter avec for et range`,`Parcourir une liste pour la transformer`],pre:[`py-listes`],
 th:`<p>Un dataset contient des milliers de lignes : personne ne les traite à la main. <code>for</code> répète, <code>if</code> décide.</p>
 ${codeBlock(`notes = [12, 15, 9, 18, 7]
reussite = 0
for n in notes:            # pour chaque note
    if n >= 10:            # décision
        reussite = reussite + 1
print(reussite / len(notes) * 100, "% de réussite")`)}
 <p>En ML, la boucle d'entraînement est exactement ce motif : <i>pour chaque exemple, prédire, mesurer l'erreur, corriger</i>.</p>`,
 quiz:[{type:"qcm",q:`Combien de fois tourne <code>for i in range(5)</code> ?`,o:[`4`,`5`,`6`],g:1,e:`range(5) produit 0,1,2,3,4 : cinq valeurs.`,w:[`range commence à 0 mais contient bien 5 valeurs.`,`Il s'arrête avant 5, donc 5 tours et non 6.`]}],

L["py-fonctions"]={t:`Fonctions Python : def et return`,l:2,p:"py",d:`45 min`,
 obj:[`Définir une fonction avec paramètres`,`Renvoyer un résultat avec return`,`Écrire sa première fonction de prédiction`],pre:[`py-boucles`],
 th:`<p>Une fonction regroupe du code sous un nom réutilisable. Conceptuellement, c'est la même chose que la fonction mathématique f(x) : entrée → sortie.</p>
 ${codeBlock(`def predire_loyer(surface, a=19.0, b=30.0):
    """Prédit un loyer à partir de la surface."""
    return a * surface + b

print(predire_loyer(45))   # 885.0`)}
 <div class="callout"><b class="t">Le déclic</b>Un modèle de régression linéaire entraîné, c'est <i>exactement</i> cette fonction : les paramètres <code>a</code> et <code>b</code> ont simplement été appris automatiquement au lieu d'être écrits à la main.</div>`,

L["py-numpy"]={t:`NumPy : tableaux, vecteurs et vitesse`,l:2,p:"py",d:`60 min`,
 obj:[`Créer et manipuler des arrays NumPy`,`Faire des calculs sur des tableaux entiers sans boucle`,`Préparer les données pour scikit-learn`],pre:[`py-fichiers`,`m-fonctions`],
 th:`<p>NumPy est LE socle numérique de Python. Son objet central, l'<b>array</b>, stocke des nombres homogènes et calcule <b>en bloc</b> : <code>array * 2</code> multiplie chaque élément, sans boucle. C'est 50 à 100× plus rapide qu'une liste Python.</p>
 ${codeBlock(`import numpy as np

surfaces = np.array([20, 30, 40, 50, 60])
loyers   = surfaces * 19 + 30        # calcul vectorisé !
print(loyers)                        # [410 600 790 980 1170]

print(surfaces.mean())               # 40.0  : moyenne
print(surfaces.reshape(5, 1).shape)  # (5, 1) : format scikit-learn`)}`,
 quiz:[{type:"qcm",q:`Que vaut <code>np.array([1, 2, 3]) * 2</code> ?`,o:[`[1, 2, 3, 1, 2, 3] (répétition)`,`[2, 4, 6]`,`Une erreur`],g:1,e:`Sur un array, * s'applique élément par élément.`,w:[`Ça, c'est le comportement des listes Python !`,`Non, c'est parfaitement valide.`]}],
 sk:[`Calcul vectorisé`,`mean, reshape, shape`],res:[`NumPy = calculs en bloc sur tableaux ; le format (n,1) est celui qu'attend scikit-learn`],nx:[`py-pandas`,`Un tableau de nombres ne suffit pas : les vrais datasets ont des colonnes nommées.`]};

L["m-stats"]={t:`Statistiques descriptives : résumer des données`,l:2,p:"math",d:`45 min`,
 obj:[`Calculer moyenne, médiane, variance, écart-type`,`Repérer les valeurs extrêmes`,`Comprendre ce que describe() affiche`],pre:[`m-nombres`,`py-pandas`],
 th:`<p>La <b>moyenne</b> donne le centre, mais elle est sensible aux valeurs extrêmes ; la <b>médiane</b> résiste mieux. La <b>variance</b> mesure la dispersion moyenne (au carré), l'<b>écart-type</b> sa version dans l'unité des données.</p>
 <div class="formula">moyenne = (Σxᵢ)/n &nbsp;&nbsp;·&nbsp;&nbsp; variance = Σ(xᵢ − moyenne)² / n</div>
 <p>Exemple : [2, 4, 6] → moyenne 4, variance ((−2)²+0²+2²)/3 = 8/3 ≈ 2,67, écart-type ≈ 1,63. En ML, ces chiffres servent à <b>normaliser</b> les features (niveau 6) et à détecter les anomalies.</p>`,
 quiz:[{type:"qcm",q:`Moyenne de [2, 4, 6] ?`,o:[`3`,`4`,`6`],g:1,e:`(2+4+6)/3 = 4.`,w:[`Addition incomplète ?`,`6 est le maximum, pas la moyenne.`]}],
 sk:[`Calculer moyenne, variance, écart-type`,`Choisir médiane vs moyenne`],res:[`Centre + dispersion = le portrait-robot de toute colonne numérique`],nx:[`m-vecteurs`,`Plusieurs features ensemble forment un vecteur : passons en plusieurs dimensions.`]};

L["m-vecteurs"]={t:`Vecteurs : la forme d'un exemple`,l:3,p:"math",d:`50 min`,full:1,
 obj:[`Définir un vecteur et le dessiner`,`Additionner, multiplier par un scalaire`,`Calculer norme et produit scalaire`,`Comprendre : un exemple ML est un vecteur`],
 pre:[`m-fonctions`,`py-numpy`],
 th:`<p>Un <b>vecteur</b> est une liste ordonnée de nombres : <code>v = (2, 3)</code>. Géométriquement, c'est une flèche depuis l'origine ; algébriquement, une fiche de données.</p>
 <h4>Trois opérations à connaître</h4>
 <ul><li><b>Addition</b> : composante par composante — (1,2)+(3,1) = (4,3).</li>
 <li><b>Norme</b> ‖v‖ : la longueur de la flèche. <code>‖(3,4)‖ = √(9+16) = 5</code>. K-Means et KNN ne font que mesurer des distances entre vecteurs.</li>
 <li><b>Produit scalaire</b> : a·b = a₁b₁ + a₂b₂. C'est LA formule centrale du ML : chaque neurone, chaque régression, chaque attention de Transformer calcule un produit scalaire.</li></ul>`,
 int:`<p>Décrivez un appartement par 3 nombres : surface, nombre de pièces, étage. L'appartement devient le point (65, 3, 2) dans un « espace des appartements ». Deux appartements <b>proches</b> dans cet espace se ressemblent — c'est toute l'intuition de KNN (« mes voisins me ressemblent ») et du clustering.</p>`,
 maths:`<div class="formula">v = (v₁, v₂, …, vₙ) &nbsp;·&nbsp; ‖v‖ = √(v₁² + … + vₙ²) &nbsp;·&nbsp; a·b = Σ aᵢbᵢ</div>
 <p>Exemple : (1, 2, 3)·(4, −1, 2) = 4 − 2 + 6 = <b>8</b>. Si le produit scalaire est grand, les vecteurs « pointent dans la même direction » ; nul, ils sont perpendiculaires. Un modèle de prédiction calcule <code>ŷ = w·x + b</code> : le produit scalaire des poids et de l'exemple.</p>`,
 py:{code:`import numpy as np

a = np.array([1, 2, 3])     # un exemple = un vecteur
b = np.array([4, -1, 2])

print(a + b)                # [5 1 5]
print(np.linalg.norm(a))    # 3.74... : longueur
print(np.dot(a, b))         # 8 : produit scalaire
print(a @ b)                # 8 aussi : notation matricielle`,
 out:`[5 1 5]
3.7416573867739413
8
8`,
 expl:[[3,`a est le vecteur-ligne d'un dataset.`],[6,`Addition élément par élément.`],[7,`norme = longueur de la flèche (Pythagore généralisé).`],[8,`dot = produit scalaire : la brique n°1 du ML.`]]},
 ml:`<p>Traduction immédiate : la régression linéaire multiple s'écrit <code>ŷ = w·x + b</code>. Le modèle apprend le vecteur de poids <code>w</code> ; prédire, c'est un produit scalaire. KNN, c'est « trouve les vecteurs x les plus proches (norme de la différence) ».</p>`,
 ex:`<p>Moteur de recherche : votre requête et chaque document sont des vecteurs ; les résultats sont classés par similarité (produit scalaire / cosinus).</p>`,

L["m-derivees"]={t:`Dérivées et gradient : la pente qui fait apprendre`,l:3,p:"math",d:`55 min`,
 obj:[`Interpréter une dérivée comme une pente`,`Dériver x², ax + b`,`Passer de dérivée à gradient`],pre:[`m-fonctions`],
 th:`<p>La <b>dérivée</b> de f en un point mesure à quelle vitesse f change quand x bouge : c'est la pente. f(x) = x² a pour dérivée f'(x) = 2x : au point x=3, la pente vaut 6, « si j'augmente x de 1, f augmente d'environ 6 ».</p>
 <p>Le <b>gradient</b> généralise aux fonctions de plusieurs variables : c'est le vecteur des dérivées partielles, et il pointe vers la plus forte montée. Pour minimiser une erreur, on marche donc <b>à l'opposé du gradient</b> : c'est la descente de gradient, moteur de tout l'apprentissage.</p>
 <div class="formula">f(x) = x² → f'(x) = 2x &nbsp;·&nbsp; ∇J = (∂J/a, ∂J/b)</div>`,
 quiz:[{type:"qcm",q:`Dérivée de f(x) = x² en x = 3 ?`,o:[`3`,`6`,`9`],g:1,e:`f′(x) = 2x donc f′(3) = 6.`,w:[`C'est la valeur de f… à √3.`,`9 est f(3), pas la pente.`]}],
 sk:[`Dériver des fonctions simples`,`Interpréter le gradient comme direction de montée`],res:[`Dérivée = pente ; gradient = direction de plus forte montée ; on apprend en descendant`],nx:[`ml-donnees`,`Avant d'entraîner, préparons correctement les données.`]};

L["reg-lin"]={t:`Régression linéaire : votre premier modèle`,l:4,p:"ml",d:`90 min`,full:1,
 obj:[`Expliquer ce que fait une régression linéaire`,`Écrire la fonction de coût MSE`,`Entraîner à la main (descente de gradient) puis avec scikit-learn`,`Prédire et interpréter les coefficients`],
 pre:[`ml-donnees`,`py-numpy`,`m-derivees`,`m-fonctions`],
 th:`<p>La régression linéaire <b>prédit un nombre</b> (un loyer, une température, une note) en traçant la droite qui passe « au mieux » à travers les données.</p>
 <h4>Le modèle</h4><p>Une droite : <code>ŷ = a·x + b</code>. ŷ (« y chapeau ») est la prédiction, x la feature, a la pente, b l'ordonnée à l'origine. <b>Entraîner</b> le modèle, c'est trouver les valeurs de a et b qui rendent les prédictions aussi justes que possible.</p>
 <h4>Comment mesure-t-on « juste » ?</h4><p>Avec une <b>fonction de coût</b> : l'erreur quadratique moyenne (MSE) — la moyenne des erreurs au carré. Élever au carré a deux effets : punir fortement les grandes erreurs, et rendre la courbe bien lisse (donc dérivable).</p>
 <h4>Comment apprend-on ?</h4><p>Par <b>descente de gradient</b> : on calcule la pente du coût par rapport à a et b, puis on fait un petit pas dans le sens qui réduit l'erreur. On répète jusqu'à convergence. Avantages : simple, rapide, interprétable. Inconvénients : ne capture que les relations en ligne droite, sensible aux valeurs extrêmes.</p>`,
 int:`<p><b>Le loyer et la surface.</b> Vous avez visité 10 appartements. Votre cerveau a déjà remarqué : plus grand = plus cher, et à peu près proportionnel. Si un 45 m² n'existe pas dans vos visites, vous savez quand même estimer son loyer en prolongeant la tendance. La régression linéaire, c'est votre intuition, mais avec une droite calculée au millimètre.</p>`,
 maths:`<div class="formula">ŷᵢ = a·xᵢ + b &nbsp;&nbsp;&nbsp; J(a,b) = (1/n) · Σ (ŷᵢ − y)²</div>
 <p><b>Lecture :</b> pour chaque exemple i, l'erreur est (prédiction − réalité). On élève au carré, on moyenne sur les n exemples : c'est le coût J. Pour le minimiser :</p>
 <div class="formula">a ← a − α · ∂J/a &nbsp;&nbsp;·&nbsp;&nbsp; b ← b − α · ∂J/∂b &nbsp;&nbsp;avec&nbsp; ∂J/a = (2/n)·Σ(ŷᵢ−y)·x</div>
 <p>α (alpha) est le <b>learning rate</b> : la taille du pas. Trop petit → lent ; trop grand → on diverge. C'est LE réglage sensible de l'optimisation.</p>`,
 py:{code:`import numpy as np

# Données : surfaces (m2) et loyers (euros)
X = np.array([20, 30, 40, 50, 60, 70], dtype=float)
y = np.array([410, 560, 730, 890, 1050, 1190], dtype=float)

a, b = 0.0, 0.0          # paramètres au hasard
lr = 0.0005              # learning rate
n = len(X)

for epoque in range(300):
    y_chapeau = a * X + b                 # 1. prédiction
    erreur = y_chapeau - y                # 2. erreur
    grad_a = (2/n) * np.sum(erreur * X)   # 3. pente du coût
    grad_b = (2/n) * np.sum(erreur)       #    pour a et pour b
    a = a - lr * grad_a                   # 4. un pas dans la descente
    b = b - lr * grad_b

print("Modèle appris : loyer = %.1f x surface + %.1f" % (a, b))
print("Prédiction 45 m2 : %.0f euros" % (a*45 + b))`,
 out:`Modèle appris : loyer = 19.0 x surface + 30.0
Prédiction 45 m2 : 885 euros`,
 expl:[[4,`Les features : une valeur par exemple.`],[5,`Les labels : ce qu'on cherche à prédire.`],[7,`On démarre d'une droite quelconque (horizontale à 0).`],[8,`Un petit pas : la descente de gradient est une marche patiente.`],[11,`Étape 1 : le modèle prédit avec ses paramètres actuels.`],[12,`Étape 2 : prédiction − réalité, pour chaque exemple.`],[13,`Étape 3 : la dérivée du MSE par rapport à a (formule du cours de maths).`],[14,`Idem pour b (sans le ×xᵢ).`],[15,`Étape 4 : on bouge a <i>contre</i> la pente — c'est ça, descendre.`],[16,`Pareil pour b. Après 300 époques, la droite est quasi parfaite.`]]},
 py2:{titre:`La version professionnelle : scikit-learn`,code:`from sklearn.linear_model import LinearRegression
import numpy as np

X = np.array([[20],[30],[40],[50],[60],[70]])   # forme (n, 1)
y = np.array([410, 560, 730, 890, 1050, 1190])

modele = LinearRegression().fit(X, y)            # entraîne
print("a =", round(modele.coef_[0], 1))
print("b =", round(modele.intercept_, 1))
print("Prédiction 45 m2 :", round(modele.predict([[45]])[0], 1), "euros")
print("R2 :", round(modele.score(X, y), 3))`,
 out:`a = 19.0
b = 30.0
Prédiction 45 m2 : 885.0 euros
R2 : 0.999`,
 expl:[[4,`scikit-learn veut X en 2D : n lignes, 1 colonne → doubles crochets.`],[6,`.fit() fait toute la descente (ici : calcul exact) en une ligne.`],[7,`coef_ : la pente apprise. intercept_ : l'ordonnée à l'origine.`],[9,`.predict() applique ŷ = ax + b.`],[10,`.score() renvoie le R² : 1 = parfait, 0 = nul.`]]},
 viz:[`viz-reglin`],
 ml:`<p><b>Interprétation des coefficients</b> : ici a = 19 signifie « chaque m² supplémentaire coûte environ 19 € de loyer ». C'est la grande force des modèles linéaires : on peut <i>expliquer</i> chaque prédiction. Cas d'usage : immobilier, prévision de demande, consommation énergétique, scoring. Erreurs fréquentes : entraîner sur des features à des échelles très différentes, oublier les valeurs extrêmes, évaluer sur le training set.</p>`,
 ex:`<p>EDF prédit la consommation électrique à partir de la température ; les sites e-commerce estiment le panier moyen selon l'ancienneté du client. Même modèle, une droite, des millions de décisions.</p>`,

  {type:"qcm",q:`Que cherche l'entraînement d'une régression linéaire ?`,o:[`La droite qui minimise l'erreur quadratique moyenne`,`Le point le plus haut du nuage`,`La moyenne des y`],g:0,e:`On ajuste a et b pour minimiser le MSE — le coût choisi.`,w:[`Le maximum n'a aucun sens ici.`,`La moyenne est un modèle constant, pas une droite.`]},

L["gd"]={t:`La descente de gradient : le moteur de l'apprentissage`,l:4,p:"ml",d:`60 min`,full:1,
 obj:[`Expliquer la descente de gradient avec une analogie`,`Régler un learning rate et observer ses effets`,`Implémenter la descente sur une fonction simple`],
 pre:[`reg-lin`,`m-derivees`],
 th:`<p>Tous les modèles du ML — de la régression au Transformer — apprennent par le même geste : <b>descendre la pente de l'erreur</b>. La descente de gradient est ce geste, formalisé.</p>
 <p>À chaque itération : ① calculer le gradient (la pente) du coût au point actuel ; ② faire un pas dans la direction opposée, d'une taille α (learning rate) ; ③ recommencer. Trois variantes selon la quantité de données utilisée par pas : <b>batch</b> (tout), <b>mini-batch</b> (un lot, le standard en deep learning), <b>stochastique</b> (un seul exemple, rapide et bruité).</p>`,
 int:`<p><b>Descendre une montagne dans le brouillard.</b> Vous ne voyez pas la vallée, seulement la pente sous vos pieds. Stratégie : tâter le terrain, faire un pas vers le bas, recommencer. La taille du pas = le learning rate. Trop timide : vous arrivez demain. Trop audacieux : vous sautez par-dessus la vallée et remontez de l'autre côté — parfois en explosant.</p>`,
 maths:`<div class="formula">w ← w − α · ∇J(w)</div>
 <p>Testons sur J(w) = (w−3)² + 1, dont le minimum est en w = 3 (J = 1). Gradient : J'(w) = 2(w−3). Départ w₀ = 0, α = 0,1 :</p>
 <table><tr><th>itération</th><th>w</th><th>gradient</th><th>nouveau w</th></tr><tr><td>1</td><td>0</td><td>−6</td><td>0 − 0,1×(−6) = 0,6</td></tr><tr><td>2</td><td>0,6</td><td>−4,8</td><td>1,08</td></tr><tr><td>3</td><td>1,08</td><td>−3,84</td><td>1,46</td></tr></table>
 <p>On se rapproche de 3, de plus en plus lentement : normal, la pente s'adoucit près du minimum.</p>`,
 viz:[`viz-gd`],
 py:{code:`w = 0.0          # départ au hasard
alpha = 0.1      # learning rate

def J(w):            # le coût : une vallée en w = 3
    return (w - 3)**2 + 1

def grad(w):         # la pente de la vallée
    return 2 * (w - 3)

for i in range(30):
    pas = alpha * grad(w)
    w = w - pas
    if i % 5 == 0:
        print("itération %2d | w = %.4f | coût = %.4f" % (i, w, J(w)))

print("Minimum trouvé : w ≈", round(w, 4))`,
 out:`itération  0 | w = 0.6000 | coût = 6.7600
itération  5 | w = 2.2131 | coût = 6.7600->1.6327
itération 10 | w = 2.8438 | coût = 1.0244
itération 20 | w = 2.9939 | coût = 1.0000
Minimum trouvé : w ≈ 2.9989`,
 expl:[[1,`Point de départ arbitraire : la descente s'en moque (ici).`],[2,`α = 0,1 : essayez 0,01 (lent) et 1,2 (explosion) dans la visualisation !`],[4,`La vallée : minimum J = 1 atteint en w = 3.`],[7,`La dérivée : elle indique sens et raideur de la pente.`],[10,`Le pas = taille × pente.`],[11,`On recule le long de la pente.`]]},
 ml:`<p>En pratique : <b>Adam</b> et ses cousins adaptent le pas automatiquement (vous les croiserez au niveau 8). Pièges classiques : features non normalisées (la vallée devient un canyon étroit), learning rate unique pour tout le monde, arrêt trop précoce. La convexité garantit un minimum global pour les modèles linéaires ; les réseaux de neurones ont des milliers de minima locaux — et s'en accommodent très bien.</p>`,
 quiz:[
  {type:"qcm",q:`Le gradient pointe toujours…`,o:[`vers le minimum`,`vers la plus forte montée du coût`,`vers zéro`],g:1,e:`C'est pourquoi on avance dans le sens <b>opposé</b> pour minimiser.`,w:[`C'est l'opposé du gradient qui descend.`,`Zéro est la valeur qu'on vise pour le gradient, pas sa direction.`]},
  {type:"qcm",q:`Un learning rate trop petit provoque :`,o:[`une divergence`,`une convergence très lente`,`un meilleur minimum`],g:1,e:`Ça converge, mais en un temps déraisonnable.`,w:[`La divergence vient d'un α trop grand.`,`Le minimum atteint est le même, en plus lent.`]}],
 mp:{n:`Trois learning rates`,d:`Lancez la descente sur J(w) avec α = 0,01 ; 0,1 ; 1,2. Tracez w en fonction des itérations pour chaque cas (matplotlib). Commentez : convergence lente, idéale, divergence.`,ch:`Remplacez J par (w−3)⁴ : la vallée est plate au fond. Que devient la descente ?`},
 res:[`w ← w − α·∇J(w) : la formule universelle`,`Le learning rate contrôle taille et stabilité du pas`,`Batch / mini-batch / stochastique : trois saveurs`],
 sk:[`Implémenter une descente de gradient`,`Diagnostiquer un learning rate`],

L["reg-log"]={t:`Régression logistique : classer avec une probabilité`,l:4,p:"ml",d:`55 min`,
 obj:[`Prédire une classe (0/1) avec un sigmoïde`,`Lire une probabilité de classe`,`Tracer une frontière de décision`],pre:[`reg-lin`,`m-probas`],
 th:`<p>Malgré son nom, la régression logistique est une <b>classification</b>. On calcule un score linéaire z = w·x + b, puis on l'écrase entre 0 et 1 avec la <b>sigmoïde</b> σ(z) = 1/(1+e⁻ᶻ) : le résultat se lit comme une probabilité d'appartenir à la classe 1. Frontière de décision : là où σ = 0,5, c'est-à-dire z = 0 — une droite. Coût : l'entropie croisée (à base de logarithme, comme promis au niveau 0).</p>`,
 quiz:[{type:"qcm",q:`La sortie d'une régression logistique est :`,o:[`Un nombre quelconque`,`Une probabilité entre 0 et 1`,`Une étiquette de classe directement`],g:1,e:`La sigmoïde borne le score entre 0 et 1.`,w:[`Ça, c'est le score z avant sigmoïde.`,`On choisit la classe ensuite, avec un seuil (0,5 en général).`]}],
 sk:[`Interpréter σ(z)`,`Choisir un seuil de décision`],res:[`Score linéaire + sigmoïde = probabilité de classe ; frontière = droite z=0`],nx:[`knn`,`Une autre façon de classer : demander l'avis de ses voisins.`]};

L["knn"]={t:`K-Nearest Neighbors : voter comme ses voisins`,l:4,p:"ml",d:`45 min`,
 obj:[`Classer un point par vote de ses k voisins`,`Choisir k et mesurer des distances`,`Comprendre pourquoi normaliser est crucial`],pre:[`m-vecteurs`,`ml-donnees`],
 th:`<p>KNN est l'algorithme le plus intuitif : pour classer un nouvel exemple, on regarde ses <b>k plus proches voisins</b> (distance euclidienne) et on fait voter la majorité. Pas de phase d'entraînement à proprement parler — le dataset <i>est</i> le modèle. Choix de k : trop petit = sensible au bruit ; trop grand = frontières floues. Attention : les features à grande échelle (revenus en milliers) écrasent les petites (âge) → il faut <b>normaliser</b>.</p>`,
 quiz:[{type:"qcm",q:`Avec k très grand (ex. k = n), KNN prédit…`,o:[`Toujours la classe majoritaire globale`,`Des frontières très précises`,`Une erreur`],g:0,e:`Tous les points votent : c'est un vote national, plus local.`,w:[`Au contraire, les frontières deviennent ultra-floues.`,`Ça fonctionne, c'est juste idiot.`]}],
 sk:[`Choisir k`,`Préparer les distances par normalisation`],res:[`Majorité des k voisins, distance euclidienne, normalisation indispensable`],nx:[`arbres`,`Autre style de classification : poser des questions en cascade.`]};

L["arbres"]={t:`Arbres de décision : le jeu des 20 questions`,l:4,p:"ml",d:`50 min`,
 obj:[`Lire un arbre : nœuds, conditions, feuilles`,`Comprendre les critères de découpe (Gini, entropie)`,`Repérer l'overfitting d'un arbre trop profond`],pre:[`knn`,`m-probas`],
 th:`<p>Un arbre pose des questions binaires en cascade : « revenu > 30 k€ ? » puis « âge < 45 ? »… À chaque nœud, il choisit <b>la question qui sépare le mieux les classes</b> (critère de Gini ou entropie — deux mesures de désordre, à base de probabilités et de log). Arrivé dans une feuille, il prédit la classe majoritaire. Immense avantage : totalement interprétable. Immense défaut : trop profond, il apprend le bruit par cœur (overfitting).</p>`,
 quiz:[{type:"qcm",q:`Un arbre de décision sans limite de profondeur risque surtout :`,o:[`l'underfitting`,`l'overfitting`,`la divergence`],g:1,e:`Il peut créer une feuille par exemple : il récite au lieu d'apprendre.`,w:[`Au contraire, il apprend trop par cœur.`,`La divergence concerne la descente de gradient.`]}],
 sk:[`Lire un arbre entraîné`,`Limiter la profondeur (max_depth)`],res:[`Questions successives qui maximisent la pureté ; interprétable mais sujet à l'overfitting`],nx:[`kmeans`,`Jusqu'ici on avait des labels. Et s'il n'y en avait pas ?`]};

L["kmeans"]={t:`K-Means : regrouper sans étiquettes`,l:4,p:"ml",d:`60 min`,full:1,
 obj:[`Expliquer le clustering non supervisé`,`Dérouler l'algorithme pas à pas`,`Choisir k et lire l'inertie`],
 pre:[`m-vecteurs`,`ml-donnees`],
 th:`<p>Jusqu'ici, chaque exemple avait sa réponse (label). Le <b>non supervisé</b> travaille sans : on cherche la <b>structure</b> cachée. K-Means regroupe les points en k grappes autour de k <b>centroïdes</b> (points moyens).</p>
 <h4>L'algorithme, en deux gestes répétés</h4>
 <ol><li><b>Affectation</b> : chaque point rejoint le centroïde le plus proche.</li>
 <li><b>Mise à jour</b> : chaque centroïde se déplace au centre de son groupe.</li></ol>
 <p>On répète jusqu'à stabilisation. Résultat : chaque point a un numéro de groupe, sans qu'on ait jamais dit à la machine ce que signifient ces groupes. L'<b>inertie</b> (somme des distances aux centroïdes) mesure la compacité : elle baisse à chaque itération. Limites : il faut choisir k, et les formes doivent être à peu près « en grappes ».</p>`,
 int:`<p><b>Ranger un entrepôt la nuit.</b> Des centaines de colis au sol, aucune étiquette. Vous posez 3 chariots au hasard, puis : chacun range chaque colis dans le chariot le plus proche ; vous déplacez ensuite chaque chariot au centre de son tas. Deux ou trois allers-retours et l'entpôt est organisé en 3 zones cohérentes — sans que personne n'ait défini ce qu'étaient ces zones.</p>`,
 maths:`<div class="formula">objectif : minimiser Σₖ Σₓ∈groupe k ‖x − μₖ‖²</div>
 <p>μₖ est le centroïde du groupe k : la moyenne des points du groupe. Chaque itération réduit cette somme — elle ne peut pas remonter, donc l'algorithme termine toujours (sur un minimum local). Pour choisir k, on trace l'inertie en fonction de k et on cherche le « coude ».</p>`,
 viz:[`viz-kmeans`],
 py:{code:`from sklearn.cluster import KMeans
import numpy as np

# 3 grappes de clients (revenu, fréquence d'achat)
np.random.seed(7)
g1 = np.random.randn(30, 2) * 4 + [20, 15]
g2 = np.random.randn(30, 2) * 4 + [55, 70]
g3 = np.random.randn(30, 2) * 4 + [80, 30]
X = np.vstack([g1, g2, g3])

km = KMeans(n_clusters=3, random_state=0, n_init=10)
km.fit(X)

print("Groupes des 6 premiers :", km.labels_[:6])
print("Centroïdes arrondis :", km.cluster_centers_.round(1).tolist())
print("Inertie :", round(km.inertia_, 1))`,
 out:`Groupes des 6 premiers : [0 0 0 0 0 0]
Centroïdes arrondis : [[19.8, 14.7], [55.1, 69.8], [80.2, 30.4]]
Inertie : 1863.2`,
 expl:[[5,`Trois nuages artificiels : dans la vraie vie, vous auriez juste X.`],[8,`On empile les 90 clients.`],[10,`n_init=10 : on tente 10 départs aléatoires et on garde le meilleur.`],[13,`labels_ : le groupe de chaque client.`],[14,`cluster_centers_ : le « client moyen » de chaque groupe.`],[15,`Inertie : plus elle est basse, plus les groupes sont compacts.`]]},
 ml:`<p><b>Bien choisir k</b> : méthode du coude (courbe inertie/k) ou silhouette. <b>Piège</b> : des échelles différentes entre features faussent les distances → normalisez d'abord (StandardScaler). Cas d'usage : segmentation client, regroupement de documents, détection d'anomalies (points loin de tout centroïde).</p>`,
 ex:`<p>Une banque segmente ses clients en 4 profils de dépense pour personnaliser ses offres ; un service client regroupe 50 000 tickets en familles de problèmes avant de les router.</p>`,
 quiz:[
  {type:"qcm",q:`K-Means est un apprentissage…`,o:[`supervisé`,`non supervisé`,`par renforcement`],g:1,e:`Aucun label : on découvre la structure des données.`,w:[`Il n'y a pas de labels à prédire.`,`Pas de récompenses ni d'agent ici.`]},
  {type:"qcm",q:`Que fait l'étape « mise à jour » ?`,o:[`Chaque point change de groupe`,`Chaque centroïde devient la moyenne de son groupe`,`On supprime les points isolés`],g:1,e:`Le centroïde se recentre sur ses membres.`,w:[`Ça, c'est l'étape d'affectation.`,`On ne supprime jamais de données ici.`]},
  {type:"vf",q:`L'inertie diminue (ou stagne) à chaque itération.`,o:[`Vrai`,`Faux`],g:0,e:`Chaque étape minimise une partie de l'objectif : elle ne peut pas augmenter.`,w:[`La démonstration vient de la structure même des deux étapes.`]}],
 mp:{n:`Segmentation de clients`,
 d:`Créez 200 clients fictifs (revenu, ancienneté) en 4 grappes. K-Means avec k = 2, 4, 8 : tracez chaque résultat et l'inertie. Où est le coude ?`,
 etapes:[`Générer les données avec np.random.randn`,`Entraîner trois KMeans`,`scatter coloré par labels_ + centroïdes`,`Tracer inertie(k)`],
 ch:`Un groupe de « fraudeurs » très petit rend K-Means aveugle. Testez, puis lisez la doc de DBSCAN.`},
 res:[`Affectation + mise à jour, en boucle`,`Inertie = compacité ; méthode du coude pour k`,`Toujours normaliser avant de mesurer des distances`],
 sk:[`Dérouler K-Means à la main`,`Choisir k avec le coude`,`Segmenter avec scikit-learn`],
 liens:[[`m-vecteurs`,`Distances`],[`fe-encodage`,`Normalisation`],[`pca`,`Autre regard non supervisé`]],
 nx:[`pca`,`Autre façon de découvrir la structure : réduire les dimensions.`]};

L["pca"]={t:`PCA : voir en 2D ce qui vit en 20D`,l:4,p:"ml",d:`50 min`,
 obj:[`Comprendre la réduction de dimensionnalité`,`Projeter sur les axes de plus grande variance`,`Utiliser PCA pour visualiser`],pre:[`m-matrices`,`m-vecteurs`],
 th:`<p>L'<b>Analyse en Composantes Principales</b> cherche les directions où les données « s'étalent » le plus, puis projette les points dessus. Première composante = direction de variance maximale ; deuxième = perpendiculaire, etc. On garde les k premières : on perd un peu d'information, on gagne énormément en lisibilité et en vitesse. Mathématiquement, ce sont les <b>vecteurs propres</b> de la matrice de covariance — vous n'avez pas besoin de savoir les calculer pour savoir les utiliser.</p>`,
 quiz:[{type:"qcm",q:`La première composante principale est la direction…`,o:[`de plus forte variance des données`,`la plus courte`,`choisie au hasard`],g:0,e:`On conserve d'abord ce qui différencie le plus les points.`,w:[`L'inverse : on perdrait tout.`,`Le calcul est déterministe.`]}],
 sk:[`Visualiser un dataset multidimensionnel`,`Lire explained_variance_ratio_`],res:[`PCA = projection sur les directions de variance maximale ; visualisation et compression`],nx:[`eval-classif`,`Nos modèles prédisent : encore faut-il savoir s'ils ont raison.`]};

L["eval-classif"]={t:`Évaluer une classification : au-delà de l'accuracy`,l:5,p:"ml",d:`70 min`,full:1,
 obj:[`Lire une matrice de confusion (TP, FP, TN, FN)`,`Calculer accuracy, precision, recall, F1`,`Choisir la bonne métrique selon le contexte`],
 pre:[`reg-log`,`m-stats`,`ml-donnees`],
 th:`<p>« 95 % de bonnes réponses » peut cacher un modèle inutile. Tout part de la <b>matrice de confusion</b>, qui croise réalité et prédictions :</p>
 <table><tr><th></th><th>Prédit MALADE</th><th>Prédit SAIN</th></tr><tr><td><b>Malade en réalité</b></td><td>TP — vrai positif ✅</td><td>FN — faux négatif ⚠️ (raté !)</td></tr><tr><td><b>Saine en réalité</b></td><td>FP — faux positif (fausse alerte)</td><td>TN — vrai négatif ✅</td></tr></table>
 <p>De là naissent les métriques :</p>
 <table><tr><th>Métrique</th><th>Formule</th><th>Question posée</th></tr>
 <tr><td><b>Accuracy</b></td><td>(TP+TN)/total</td><td>« Globalement, combien de bonnes réponses ? »</td></tr>
 <tr><td><b>Precision</b></td><td>TP/(TP+FP)</td><td>« Quand il crie au loup, a-t-il raison ? »</td></tr>
 <tr><td><b>Recall</b></td><td>TP/(TP+FN)</td><td>« A-t-il trouvé tous les malades ? »</td></tr>
 <tr><td><b>F1</b></td><td>2·P·R/(P+R)</td><td>« Le compromis entre les deux »</td></tr></table>
 <p><b>L'erreur classique :</b> 99 % de sains, 1 % de malades. Un modèle qui répond toujours « sain » atteint 99 % d'accuracy… et rate 100 % des malades. Sur données déséquilibrées, l'accuracy ment : regardez recall, precision, F1, et la courbe ROC/AUC.</p>`,
 int:`<p><b>Dépistage à l'aéroport.</b> Precision : « quand l'alarme sonne, quelle chance que ce soit vraiment dangereux ? » (trop de fausses alarmes = plus personne n'y croit). Recall : « a-t-on laissé passer quelque chose de dangereux ? » (un seul faux négatif peut être grave). Selon l'enjeu, on pousse l'un ou l'autre : détecteur de fraude bancaire ≠ filtre de spam.</p>`,
 maths:`<p>Exemple numérique : TP = 40, FN = 10, FP = 5, TN = 45.</p>
 <div class="formula">accuracy = 85/100 = 0,85 &nbsp;·&nbsp; precision = 40/45 ≈ 0,89 &nbsp;·&nbsp; recall = 40/50 = 0,80 &nbsp;·&nbsp; F1 ≈ 0,84</div>
 <p>Le recall de 0,80 révèle ce que l'accuracy cachait : 10 malades sur 50 passent à la trappe.</p>`,
 py:{code:`from sklearn.metrics import (confusion_matrix,
    classification_report, accuracy_score)

y_vrai  = [1,1,1,1,0,0,0,0,1,0]
y_pred  = [1,1,0,1,0,0,1,0,1,0]

print("Accuracy :", accuracy_score(y_vrai, y_pred))
print(confusion_matrix(y_vrai, y_pred))
print(classification_report(y_vrai, y_pred))`,
 out:`Accuracy : 0.8
[[4 1]
 [1 4]]
              precision    recall  f1-score   support
           0       0.80      0.80      0.80         5
           1       0.80      0.80      0.80         5
    accuracy                           0.80        10`,
 expl:[[4,`La vérité terrain : 5 positifs (1), 5 négatifs (0).`],[5,`Les prédictions du modèle : deux erreurs, une de chaque côté.`],[7,`80 % de bonnes réponses au total.`],[8,`Lignes = réalité, colonnes = prédictions.`],[9,`Le rapport complet : P, R, F1 par classe — à lire à chaque projet.`]]},
 ml:`<p><b>Choisir selon le coût de l'erreur.</b> Cancer → recall d'abord (rater un malade est dramatique). Spam → precision d'abord (supprimer un vrai mail est inacceptable). La courbe <b>ROC</b> trace recall en fonction du taux de fausses alarmes pour tous les seuils ; l'<b>AUC</b> la résume en un score (1 = parfait, 0,5 = pile ou face). Pour la régression, ce sont MAE/MSE/R² (leçon suivante).</p>`,
 ex:`<p>Un prêteur bancaire préfère rater quelques bons dossiers (FP) plutôt que d'accorder à des insolvables ; un tri de déchets industriels préfère ne rater aucun plastique recyclable (recall).</p>`,
 quiz:[
  {type:"qcm",q:`Dataset : 99 % classe A, 1 % classe B. Un modèle qui prédit toujours A a :`,o:[`une accuracy de 99 % mais aucun intérêt`,`une accuracy de 50 %`,`un recall de 100 % sur B`],g:0,e:`C'est LE piège : l'accuracy est haute, le recall sur B est… 0 %.`,w:[`Il a raison 99 fois sur 100, mathématiquement.`,`Sur la classe B, il ne trouve rien : recall = 0.`]},
  {type:"qcm",q:`Pour un dépistage de maladie grave, on privilégie :`,o:[`la precision`,`le recall`,`l'accuracy`],g:1,e:`Il faut attraper un maximum de malades, quitte à vérifier ensuite les fausses alertes.`,w:[`La precision limiterait les fausses alertes, mais au prix de malades ratés.`,`L'accuracy masque le déséquilibre.`]},
  {type:"qcm",q:`TP=40, FN=10. Le recall vaut :`,o:[`0,80`,`0,89`,`0,40`],g:0,e:`40/(40+10) = 0,80.`,w:[`0,89 serait la precision si FP=5.`,`40/100 est la part de TP dans le total.`]}],
 mp:{n:`Duel de modèles`,
 d:`Deux classifieurs sur les mêmes 200 prédictions : M1 (TP=60, FP=20, FN=10, TN=110), M2 (TP=55, FP=5, FN=15, TN=125). Calculez accuracy, precision, recall, F1 de chacun. Lequel choisissez-vous pour détecter une fraude ? Pour filtrer du spam ?`,
 etapes:[`Poser les matrices de confusion`,`Appliquer les 4 formules`,`Argumenter selon le contexte`],
 ch:`Tracez la courbe ROC des deux modèles avec sklearn.metrics.roc_curve à partir de probabilités simulées.`},
 res:[`Accuracy globale, precision « qualité », recall « couverture », F1 compromis`,`Sur données déséquilibrées, l'accuracy ment`,`La bonne métrique dépend du coût de chaque type d'erreur`],
 sk:[`Lire une matrice de confusion`,`Choisir une métrique selon l'enjeu`,`Utiliser classification_report`],
