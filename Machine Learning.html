L["eval-reg"]={t:`Évaluer une régression : MAE, MSE, RMSE, R²`,l:5,p:"ml",d:`45 min`,
 obj:[`Choisir entre MAE et MSE`,`Interpréter un R²`,`Comprendre l'effet du carré`],pre:[`reg-lin`,`eval-classif`],
 th:`<p><b>MAE</b> (erreur absolue moyenne) : l'erreur « en vrai », dans l'unité des données, robuste aux extrêmes. <b>MSE</b> : pareil mais au carré — les grandes erreurs sont écrasées de punition, et la formule est bien dérivable. <b>RMSE</b> = √MSE : retour dans l'unité des données. <b>R²</b> : la part de variance expliquée par le modèle ; 1 = parfait, 0 = aussi bien que prédire la moyenne, négatif = pire.</p>`,
 quiz:[{type:"qcm",q:`R² = 0,95 signifie :`,o:[`Le modèle explique 95 % de la variance des y`,`Le modèle a 95 % de bonnes réponses`,`L'erreur moyenne est 0,95`],g:0,e:`C'est la proportion de variance capturée par le modèle.`,w:[`L'accuracy est une notion de classification.`,`0,95 est un ratio, pas une erreur.`]}],
 sk:[`Choisir MAE vs MSE`,`Lire un R²`],res:[`MAE lisible, MSE punisseur, RMSE en unités réelles, R² en pourcentage de variance`],nx:[`cv`,`Un score sur un seul découpage peut être un coup de chance.`]};

L["cv"]={t:`Cross-validation : des scores dignes de confiance`,l:5,p:"ml",d:`45 min`,
 obj:[`Dérouler un k-fold à la main`,`Comparer des modèles avec cross_val_score`],pre:[`eval-classif`,`eval-reg`],
 th:`<p>Avec un seul découpage train/test, le score dépend du tirage au sort. La <b>validation croisée k-fold</b> répète l'expérience : on découpe les données en k plis, on entraîne k fois en laissant chaque pli servir de validation à tour de rôle, et on moyenne les k scores. On obtient une estimation <b>stable</b> et un écart-type — la sincérité statistique du machine learning.</p>
 ${codeBlock(`from sklearn.model_selection import cross_val_score
scores = cross_val_score(modele, X, y, cv=5, scoring="accuracy")
print(scores.round(3), "-> moyenne", scores.mean().round(3))`)}`,
 quiz:[{type:"qcm",q:`En 5-fold, chaque exemple sert de données de validation…`,o:[`1 fois sur 5`,`5 fois`,`Jamais`],g:0,e:`Chaque pli est le pli de validation une seule fois, les 4 autres servent à entraîner.`,w:[`Chaque pli n'est validé qu'une fois.`,`Il sert aussi à entraîner dans les autres tours, mais validation = 1 fois.`]}],
 sk:[`Utiliser cross_val_score`,`Comparer la moyenne ET l'écart-type`],res:[`k plis, k entraînements, un score moyen ± écart-type : la base de toute comparaison honnête`],nx:[`fe-nettoyage`,`Scores fiables en main : nettoyons maintenant les données elles-mêmes.`]};

L["fe-nettoyage"]={t:`Nettoyage : valeurs manquantes et doublons`,l:6,p:"ml",d:`50 min`,
 obj:[`Détecter et traiter les valeurs manquantes`,`Supprimer doublons et valeurs aberrantes`,`Décider : supprimer ou imputer`],pre:[`py-pandas`,`m-stats`],
 th:`<p>Les vraies données sont sales. Valeurs manquantes : on supprime la ligne (si rares), on <b>impute</b> par la moyenne/médiane (si numériques), ou par la classe la plus fréquente. Valeurs aberrantes : on vérifie d'abord si ce n'est pas une erreur de saisie — parfois l'« anomalie » est justement ce qu'on cherche (fraude !). pandas : <code>df.isna().sum()</code>, <code>df.fillna()</code>, <code>df.drop_duplicates()</code>.</p>`,
 quiz:[{type:"qcm",q:`Une colonne a 30 % de valeurs manquantes. La meilleure première idée :`,o:[`Supprimer toutes les lignes`,`Imputer par la médiane ou créer un indicateur de manquants`,`Remplacer par 0`],g:1,e:`Supprimer 30 % des données est violent ; 0 serait une fausse information.`,w:[`Perte massive d'information.`,`0 n'est pas une valeur « neutre », c'est une valeur fausse.`]}],
 sk:[`Diagnostiquer avec isna()`,`Imputer proprement`],res:[`Diagnostiquer → décider (supprimer/imputer) → documenter ce qu'on a fait`],nx:[`fe-encodage`,`Données propres : mettons-les à la bonne échelle.`]};

L["fe-encodage"]={t:`Normalisation, standardisation, encodage`,l:6,p:"ml",d:`55 min`,
 obj:[`Mettre les features numériques à la même échelle`,`Encoder les catégories (one-hot, ordinal)`,`Savoir quel modèle exige quoi`],pre:[`fe-nettoyage`,`m-stats`,`knn`],
 th:`<p><b>Standardisation</b> : on recentre sur 0 avec un écart-type de 1 → (x − moyenne)/écart-type. <b>Normalisation min-max</b> : on ramène tout dans [0, 1]. Indispensable pour KNN, K-Means, SVM, réseaux de neurones, PCA — tout ce qui mesure des distances ou descend un gradient. Les arbres, eux, s'en moquent. <b>Catégories</b> : un modèle ne lit pas « Paris » → one-hot encoding crée une colonne binaire par modalité ; l'encodage ordinal réserve un ordre (petit/moyen/grand).</p>`,
 quiz:[{type:"qcm",q:`Pourquoi normaliser avant un KNN ?`,o:[`Pour accélérer Python`,`Sinon la feature à grande échelle domine la distance`,`C'est obligatoire pour tout modèle`],g:1,e:`La distance euclidienne est gouvernée par la plus grande échelle.`,w:[`L'effet est géométrique, pas matériel.`,`Les arbres n'en ont pas besoin.`]}],
 sk:[`StandardScaler / OneHotEncoder`,`Choisir selon le modèle`],res:[`Distances et gradients exigent l'échelle ; les arbres s'en passent ; one-hot pour les catégories`],nx:[`fe-selection`,`Trop de features tue la feature : apprenons à choisir.`]};

L["fe-selection"]={t:`Sélection de features : moins, mais mieux`,l:6,p:"ml",d:`45 min`,
 obj:[`Éliminer les features inutiles ou redondantes`,`Utiliser corrélations et importances`,`Comprendre la malédiction de la dimension`],pre:[`fe-encodage`,`arbres`],
 th:`<p>Chaque feature inutile ajoute du bruit et du risque d'overfitting. Outils : matrice de corrélation (deux features identiques ? on en garde une), importances d'un Random Forest, méthodes récursives. Plus il y a de dimensions, plus les données deviennent « clairsemées » et les distances peu informatives : c'est la <b>malédiction de la dimension</b>. 20 features pertinentes battent 2 000 features au hasard.</p>`,
 quiz:[{type:"qcm",q:`Une feature totalement aléatoire dans le modèle risque :`,o:[`d'améliorer toujours les résultats`,`de créer de l'overfitting sans rien apporter`,`de faire diverger l'entraînement`],g:1,e:`Le modèle peut y trouver des motifs illusoires sur le training set.`,w:[`Au mieux elle n'apporte rien, au pire elle nuit.`,`La divergence n'a pas de rapport.`]}],
 sk:[`Lire une matrice de corrélation`,`Utiliser feature_importances_`],res:[`Corrélation, importances, parcimonie : chaque feature doit mériter sa place`],nx:[`ml-forets`,`Et si on combinait des centaines d'arbres ?`]};

L["ml-forets"]={t:`Random Forest : la sagesse des arbres en foule`,l:7,p:"ml",d:`50 min`,
 obj:[`Expliquer le bagging et le vote d'arbres`,`Lire feature_importances_`,`Régler n_estimators et max_depth`],pre:[`arbres`,`cv`],
 th:`<p>Un arbre apprend par cœur ; cent arbres qui votent, rarement. Le <b>Random Forest</b> entraîne des centaines d'arbres sur des échantillons tirés avec remise (bagging) et des sous-ensembles de features aléatoires, puis fait voter la majorité. Les erreurs individuelles se compensent : le vote collectif est bien plus robuste. Bonus : l'importance des features, gratuite et précieuse. C'est souvent LE premier modèle sérieux à dégainer sur des données tabulaires.</p>`,
 quiz:[{type:"qcm",q:`Une Random Forest bat souvent un arbre seul parce que :`,o:[`elle est plus profonde`,`les erreurs des arbres individuels se compensent par le vote`,`elle utilise la descente de gradient`],g:1,e:`Diversité + vote = variance réduite.`,w:[`Chaque arbre est au contraire souvent limité.`,`Les arbres n'utilisent pas la descente de gradient.`]}],
 sk:[`Entraîner une RandomForest`,`Interpréter les importances`],res:[`Bagging + features aléatoires + vote : robuste, interprétable, excellent par défaut`],nx:[`ml-boosting`,`L'autre grande famille d'ensembles : corriger ses erreurs en série.`]};

L["ml-boosting"]={t:`Boosting & XGBoost : corriger ses erreurs en série`,l:7,p:"ml",d:`55 min`,
 obj:[`Expliquer la différence bagging vs boosting`,`Comprendre le gradient boosting`,`Savoir quand sortir XGBoost`],pre:[`ml-forets`,`gd`],
 th:`<p>Le <b>boosting</b> entraîne des arbres <b>en série</b> : chaque nouvel arbre se concentre sur les erreurs du précédent (le gradient boosting fait ça proprement en descendant le gradient de la loss). Là où le Random Forest vote entre modèles indépendants, le boosting affine, coup après coup. XGBoost et LightGBM dominent depuis des années la plupart des compétitions de données tabulaires. Attention : plus de réglages, plus de risque d'overfitting si on néglige la régularisation.</p>`,
 quiz:[{type:"qcm",q:`En gradient boosting, les arbres sont entraînés :`,o:[`en parallèle et votent`,`séquentiellement, chacun corrigeant les erreurs résiduelles`,`sans labels`],g:1,e:`Chaque arbre modélise le résidu laissé par l'ensemble.`,w:[`Le parallélisme, c'est le bagging.`,`C'est supervisé.`]}],
 sk:[`Installer et utiliser xgboost`,`Régler learning_rate et n_estimators`],res:[`Séquence d'arbres correcteurs : redoutable sur le tabulaire, exige du réglage`],nx:[`ml-tuning`,`Ces modèles ont des dizaines de réglages : automatisons leur recherche.`]};

L["ml-tuning"]={t:`Hyperparamètres : GridSearch et RandomizedSearch`,l:7,p:"ml",d:`50 min`,
 obj:[`Distinguer paramètre appris et hyperparamètre`,`Chercher la meilleure combinaison avec GridSearchCV`,`Éviter l'overfitting du réglage`],pre:[`cv`,`ml-forets`],
 th:`<p>Les <b>paramètres</b> (pente d'une droite, poids d'un neurone) sont appris des données. Les <b>hyperparamètres</b> (profondeur d'un arbre, learning rate, k de KNN) sont choisis par l'humain — et se règlent par recherche : GridSearchCV explore une grille de combinaisons <i>avec validation croisée</i>, donc sans toucher au test set. On peut aussi chercher au hasard (RandomizedSearchCV), souvent plus efficace sur les grands espaces.</p>`,
 quiz:[{type:"qcm",q:`Le learning rate est :`,o:[`un paramètre appris automatiquement`,`un hyperparamètre réglé avant l'entraînement`,`une métrique`],g:1,e:`C'est l'humain qui le fixe ; la machine, elle, apprend les poids.`,w:[`Il est fixé avant, pas appris.`,`C'est un réglage, pas une mesure.`]}],
 sk:[`Construire une grille de recherche`,`Lire les résultats de GridSearchCV`],res:[`Paramètres appris ≠ hyperparamètres choisis ; recherche + CV, jamais sur le test set`],nx:[`ml-pipelines`,`Enchaînons nettoyage, encodage et modèle sans fuite.`]};

L["ml-pipelines"]={t:`Pipelines scikit-learn : zéro fuite de données`,l:7,p:"ml",d:`50 min`,
 obj:[`Assembler prétraitement + modèle dans un Pipeline`,`Comprendre le leakage et comment le pipeline l'évite`],pre:[`fe-encodage`,`ml-tuning`],
 th:`<p>Le <b>leakage</b> : calculer la moyenne des données <i>avant</i> le découpage train/test, puis l'utiliser pour imputer — le test set a alors « contaminé » l'entraînement. Le <code>Pipeline</code> scikit-learn enchaîne les étapes (imputation → encodage → modèle) et garantit que chaque calcul ne voit que le fold d'entraînement. Code plus propre, résultats plus honnêtes, déploiement plus simple.</p>`,
 quiz:[{type:"qcm",q:`Le plus grand avantage d'un Pipeline :`,o:[`il va plus vite`,`il empêche les fuites de données entre prétraitement et validation`,`il remplace le test set`],g:1,e:`Les statistiques du prétraitement sont calculées fold par fold, uniquement sur l'entraînement.`,w:[`La vitesse est secondaire.`,`Le test set reste indispensable.`]}],
 sk:[`Construire ColumnTransformer + Pipeline`,`GridSearch sur un pipeline`],res:[`Pipeline = hygiène expérimentale : chaque étape n'apprend que du training fold`],nx:[`ml-shap`,`Le modèle décide : exigeons des explications.`]};

L["ml-shap"]={t:`Interprétabilité : SHAP et le droit de comprendre`,l:7,p:"ml",d:`45 min`,
 obj:[`Expliquer pourquoi un modèle a décidé`,`Lire un summary plot SHAP`],pre:[`ml-forets`,`ml-pipelines`],
 th:`<p>Un refus de crédit doit pouvoir s'expliquer — la loi l'exige parfois. <b>SHAP</b> attribue à chaque feature de chaque prédiction une contribution signée : « +120 € parce que surface = 70 m², −40 € parce que étage = 0 ». Fondé sur la théorie des jeux (valeurs de Shapley), c'est l'outil standard d'audit de modèles. On distingue explications globales (qu'est-ce qui compte en général ?) et locales (pourquoi cette décision-ci ?).</p>`,
 quiz:[{type:"qcm",q:`SHAP sert à :`,o:[`accélérer l'entraînement`,`attribuer à chaque feature une contribution à chaque prédiction`,`remplacer la validation croisée`],g:1,e:`C'est un outil d'explication, pas d'optimisation.`,w:[`Aucun effet sur la vitesse.`,`L'évaluation reste indispensable.`]}],
 sk:[`Installer shap`,`Lire un beeswarm plot`],res:[`Chaque prédiction s'explique par des contributions signées : confiance, audit, conformité`],nx:[`dl-neurone`,`Les modèles classiques n'ont plus de secret. Construisons un neurone.`]};

L["dl-neurone"]={t:`Le neurone artificiel : la brique du Deep Learning`,l:8,p:"dl",d:`65 min`,full:1,
 obj:[`Décomposer un neurone : entrées pondérées, biais, activation`,`Calculer une sortie à la main puis avec NumPy`,`Comprendre que la régression logistique est un neurone`],
 pre:[`m-vecteurs`,`reg-log`,`py-numpy`],
 th:`<p>Un <b>neurone artificiel</b> fait trois choses, dans cet ordre :</p>
 <ol><li><b>Somme pondérée</b> : chaque entrée xᵢ est multipliée par son poids wᵢ, on ajoute un biais b → z = w₁x₁ + w₂x₂ + w₃x₃ + b.</li>
 <li><b>Activation</b> : une fonction non linéaire transforme z. La <b>sigmoïde</b> σ(z) = 1/(1+e⁻) écrase tout entre 0 et 1 : parfait pour une probabilité.</li>
 <li><b>Sortie</b> : a = σ(z), l'activation du neurone.</li></ol>
 <p>Les poids disent <b>l'importance</b> de chaque entrée (positif = encourage, négatif = freine) ; le biais est le <b>seuil de déclenchement</b>. Et la révélation du chapitre : <b>une régression logistique est exactement un neurone sigmoïde</b>. Le deep learning, c'est ce même neurone en très grand nombre, empilé en couches.</p>`,
 int:`<p><b>Décider d'aller à un concert.</b> Trois critères : l'affiche vous plaît (x₁), vos amis y vont (x₂), le prix est raisonnable (x₃). Vous accordez une importance différente à chaque critère — ce sont les <b>poids</b>. Même sans ami, une affiche exceptionnelle peut suffire si votre enthousiasme de base (le <b>biais</b>) est élevé. Le neurone fait ce calcul : puis la sigmoïde transforme votre score d'envie en décision nette : « j'y vais / je n'y vais pas ».</p>`,
 maths:`<div class="formula">z = Σ wᵢx + b &nbsp;&nbsp;→&nbsp;&nbsp; a = σ(z) = 1 / (1 + e⁻ᶻ)</div>
 <p>Exemple : x = (1 ; 0,5 ; 1), w = (2 ; −1 ; 0,5), b = −1. z = 2×1 − 1×0,5 + 0,5×1 − 1 = 1,0. σ(1) ≈ <b>0,73</b> : le neurone « s'allume » à 73 %. Remarquez : le poids négatif de x₂ freine la décision, exactement comme un critère dissuasif.</p>`,
 viz:[`viz-neurone`],
 py:{code:`import numpy as np

x = np.array([1.0, 0.5, 1.0])      # les entrées
w = np.array([2.0, -1.0, 0.5])     # les poids
b = -1.0                           # le biais

z = np.dot(w, x) + b               # somme pondérée
def sigmoide(z):
    return 1 / (1 + np.exp(-z))

print("z =", z)                    # 1.0
print("activation =", round(sigmoide(z), 3))  # 0.731`,
 out:`z = 1.0
activation = 0.731`,
 expl:[[3,`Les trois critères, chacun entre 0 et 1.`],[4,`Deux encouragent, un freine (poids négatif).`],[5,`Le biais : l'humeur de base du neurone.`],[7,`Le fameux produit scalaire w·x du niveau 3, plus le biais.`],[8,`La sigmoïde : la courbe en S qui borne entre 0 et 1.`],[11,`0,731 : le neurone est plutôt allumé.`]]},
 ml:`<p><b>Et l'apprentissage ?</b> Exactement comme la régression linéaire : une loss mesure l'écart, la descente de gradient ajuste les poids. Un seul neurone = un classifieur linéaire. Pour dépasser les frontières droites, il faudra des couches (leçon suivante) et la magie de la backpropagation. Fonctions d'activation célèbres : sigmoïde, tanh, et surtout <b>ReLU</b> (max(0, z)) — la préférée des couches cachées.</p>`,
 ex:`<p>Chaque neurone d'un grand modèle de langage (des centaines de milliards) applique cette formule. GPT ne « pense » pas : il multiplie, additionne, active — à une échelle vertigineuse.</p>`,
 quiz:[
  {type:"qcm",q:`Dans un neurone, les poids servent à :`,o:[`donner de l'importance relative à chaque entrée`,`accélérer le calcul`,`stocker les labels`],g:0,e:`Un grand poids = une entrée qui compte ; négatif = une entrée qui freine.`,w:[`La vitesse dépend du matériel.`,`Les labels sont les cibles d'entraînement.`]},
  {type:"qcm",q:`σ(0) vaut :`,o:[`0`,`0,5`,`1`],g:1,e:`1/(1+e⁰) = 1/2 : le point milieu de la courbe en S.`,w:[`σ ne vaut jamais 0 exactement.`,`σ n'atteint jamais 1 exactement non plus.`]},
  {type:"vf",q:`Une régression logistique est un neurone artificiel avec une activation sigmoïde.`,o:[`Vrai`,`Faux`],g:0,e:`Même formule, même apprentissage : z = w·x + b puis σ.`,w:[`Comparez les formules des deux leçons : identiques.`]}],
 mp:{n:`Le neurone qui calcule ET / OU`,
 d:`Trouvez à la main des poids et un biais pour qu'un neurone sigmoïde imite la porte logique OU (sortie > 0,5 si au moins une entrée sur deux vaut 1), puis la porte ET. Vérifiez avec NumPy sur les 4 combinaisons (0,0), (0,1), (1,0), (1,1).`,
 etapes:[`Choisir w1, w2, b`,`Calculer σ pour les 4 entrées`,`Ajuster jusqu'à ce que les sorties séparent 0 et 1`],
 ch:`Essayez avec la porte XOR. Ça bloque ? Normal : une droite ne sépare pas un XOR. Il faut deux neurones — leçon suivante.`},
 res:[`z = w·x + b puis activation : la formule de chaque neurone`,`Poids = importance, biais = seuil`,`Sigmoïde → probabilité ; ReLU pour les couches cachées`],
 sk:[`Calculer la sortie d'un neurone à la main`,`Relier neurone et régression logistique`],
 liens:[[`reg-log`,`Le même modèle`],[`dl-mlp`,`Empiler les neurones`],[`dl-backprop`,`Les faire apprendre`]],
 nx:[`dl-mlp`,`Un neurone sépare avec une droite. Empilons-les pour séparer n'importe quoi.`]};

L["dl-activation"]={t:`Fonctions d'activation : sigmoïde, tanh, ReLU`,l:8,p:"dl",d:`40 min`,
 obj:[`Comparer sigmoïde, tanh, ReLU, softmax`,`Savoir laquelle choisir et où`],pre:[`dl-neurone`],
 th:`<p><b>Sigmoïde</b> : sortie entre 0 et 1 → probabilités binaires ; mais elle « sature » (gradients minuscules aux extrêmes). <b>Tanh</b> : entre −1 et 1, mieux centrée. <b>ReLU</b> : max(0, z) — simple, rapide, la référence des couches cachées (défaut : neurones « morts » si toujours négatifs). <b>Softmax</b> : transforme des scores en un vrai partage de probabilités entre plusieurs classes — la sortie standard des classifieurs multi-classes.</p>`,
 quiz:[{type:"qcm",q:`La fonction la plus utilisée dans les couches cachées modernes :`,o:[`sigmoïde`,`ReLU`,`softmax`],g:1,e:`Rapide à calculer et à dériver, elle évite la saturation.`,w:[`Réservée aux sorties binaires, elle sature vite.`,`Softmax s'utilise en couche de sortie multi-classes.`]}],
 sk:[`Choisir une activation selon la couche`],res:[`Cachées : ReLU ; sortie binaire : sigmoïde ; sortie multi-classes : softmax`],nx:[`dl-mlp`,`Empilons les neurones en couches.`]};

L["dl-mlp"]={t:`Perceptron multicouche : la puissance de l'empilement`,l:8,p:"dl",d:`55 min`,
 obj:[`Comprendre couches, couches cachées et sortie`,`Résoudre le XOR avec 2 neurones`,`Saisir la notion d'approximateur universel`],pre:[`dl-neurone`,`dl-activation`],
 th:`<p>Un neurone = une droite de décision. Des neurones en <b>couche</b>, dont les sorties nourrissent une couche suivante, tracent des frontières courbes et brisées. La couche d'entrée reçoit les features, les <b>couches cachées</b> construisent des représentations intermédiaires de plus en plus abstraites, la couche de sortie répond. Sans fonction d'activation non linéaire, tout l'empilement s'effondre… en une simple régression linéaire. Théorème d'approximation universelle : un MLP assez large peut approcher n'importe quelle fonction continue.</p>`,
 quiz:[{type:"qcm",q:`Un réseau sans aucune fonction d'activation calcule au final :`,o:[`une fonction linéaire`,`une convolution`,`un arbre de décision`],g:0,e:`Composer des fonctions linéaires reste linéaire : les couches s'annulent conceptuellement.`,w:[`Les convolutions sont des architectures spécifiques.`,`Rien à voir avec les arbres.`]}],
 sk:[`Dessiner une architecture`,`Compter les paramètres`],res:[`Couches empilées + non-linéarités = frontières complexes ; chaque poids est appris`],nx:[`dl-backprop`,`Comment ces milliers de poids apprennent-ils ensemble ?`]};

L["dl-backprop"]={t:`Backpropagation : la descente à reculons`,l:8,p:"dl",d:`60 min`,
 obj:[`Expliquer pourquoi chaque poids reçoit sa part de responsabilité`,`Relier backprop et règle de la chaîne`],pre:[`dl-mlp`,`gd`,`m-derivees`],
 th:`<p>Le réseau a prédit, s'est trompé : <b>qui est responsable ?</b> La backpropagation répond en propageant l'erreur de la sortie vers l'entrée, et attribue à chaque poids sa part de responsabilité via la <b>règle de la chaîne</b> : ∂loss/∂poids = produit des dérivées le long du chemin. Puis la descente de gradient fait son travail habituel. C'est tout. PyTorch le fait automatiquement (autograd) — vous n'écrirez jamais ces dérivées à la main, mais comprendre le principe vous rend capable de diagnostiquer un réseau qui n'apprend pas.</p>`,
 quiz:[{type:"qcm",q:`La backpropagation utilise surtout :`,o:[`la règle de la chaîne (dérivées composées)`,`le théorème de Bayes`,`la méthode du coude`],g:0,e:`Elle compose les dérivées de chaque étape du calcul.`,w:[`Bayes est un théorème de probabilités.`,`Le coude sert à choisir k en clustering.`]}],
 sk:[`Expliquer un gradient qui disparaît/explose`,`Lire le graphe de calcul`],res:[`Erreur propagée à reculons, responsabilité attribuée par dérivation en chaîne`],nx:[`py-pytorch`,`Assez de théorie : faisons-le faire par PyTorch.`]};

L["py-pytorch"]={t:`PyTorch : tenseurs, autograd et premier réseau`,l:8,p:"py",d:`75 min`,
 obj:[`Manipuler des tenseurs`,`Comprendre autograd (dérivées automatiques)`,`Écrire un nn.Module minimal`],pre:[`dl-neurone`,`py-numpy`],
 th:`<p>PyTorch est la bibliothèque reine du deep learning moderne. Son objet central, le <b>tenseur</b>, est un tableau NumPy qui sait (a) vivre sur GPU et (b) calculer ses propres dérivées grâce à <b>autograd</b>. Un modèle s'écrit comme une classe héritant de <code>nn.Module</code> : on y déclare les couches, et <code>forward()</code> décrit le trajet des données.</p>
 ${codeBlock(`import torch
import torch.nn as nn

x = torch.tensor([2.0, 3.0], requires_grad=True)
y = (x ** 2).sum()     # y = x1² + x2²
y.backward()           # dérivées automatiques !
print(x.grad)          # tensor([4., 6.]) = [2x1, 2x2]

class MiniReseau(nn.Module):
    def __init__(self):
        super().__init__()
        self.fc1 = nn.Linear(4, 16)   # 4 features -> 16 neurones
        self.fc2 = nn.Linear(16, 1)   # -> 1 sortie
    def forward(self, x):
        return self.fc2(torch.relu(self.fc1(x)))`)}`,
 quiz:[{type:"qcm",q:`L'objet fondamental de PyTorch est :`,o:[`le DataFrame`,`le tenseur`,`l'arbre`],g:1,e:`Un tableau multidimensionnel, dérivable et compatible GPU.`,w:[`Ça, c'est pandas.`,`Ça, c'est scikit-learn.`]}],
 sk:[`Créer des tenseurs`,`Utiliser backward()`,`Définir un nn.Module`],res:[`tenseur + autograd + nn.Module : le trio qui fait tourner tout le DL moderne`],nx:[`cv-images`,`Appliquons tout ça à des pixels.`]};

L["cv-images"]={t:`Images = tenseurs : voir en nombres`,l:9,p:"dl",d:`45 min`,
 obj:[`Lire une image comme un tableau H×L×3`,`Normaliser des pixels`,`Charger un dataset image`],pre:[`dl-mlp`,`py-pytorch`],
 th:`<p>Une image couleur de 32×32 pixels est un tenseur 32×32×3 : 3 072 nombres entre 0 et 255. Avant d'entrer dans un réseau, on divise par 255 (normalisation) et souvent on recadre/rote légèrement les images d'entraînement (<b>data augmentation</b>) pour muscler la robustesse. Le dataset d'initiation universel : MNIST, 70 000 chiffres manuscrits.</p>`,
 quiz:[{type:"qcm",q:`Une image RGB de 32×32 contient combien de valeurs ?`,o:[`1024`,`3072`,`32`],g:1,e:`32 × 32 × 3 canaux = 3 072.`,w:[`Ça, c'est sans les canaux.`,`Un seul pixel.`]}],
 sk:[`Ouvrir une image en tenseur`,`Normaliser par 255`],res:[`Image = grille de nombres ; normaliser puis augmenter`],nx:[`cv-cnn`,`Un MLP sur des pixels oublie que l'image a une géométrie.`]};

L["cv-cnn"]={t:`CNN : convolutions, filtres et pooling`,l:9,p:"dl",d:`60 min`,
 obj:[`Expliquer convolution, filtres et cartes d'activation`,`Comprendre le rôle du pooling`],pre:[`cv-images`],
 th:`<p>Un <b>CNN</b> (réseau convolutif) exploite la géométrie de l'image : de petits <b>filtres</b> (matrices 3×3 typiquement) glissent sur toute l'image et détectent des motifs locaux — bord, texture, puis contour, puis œil, puis visage au fil des couches. Chaque filtre produit une carte d'activation. Le <b>pooling</b> (max) résume chaque zone : plus compact, plus tolérant aux translations. Résultat : beaucoup moins de paramètres qu'un MLP, et une compréhension hiérarchique de l'image.</p>`,
 quiz:[{type:"qcm",q:`Les filtres d'un CNN apprennent à détecter :`,o:[`des motifs locaux (bords, textures, formes)`,`des couleurs uniques`,`des étiquettes`],g:0,e:`Chaque filtre se spécialise sur un motif, des plus simples aux plus abstraits.`,w:[`La couleur n'est qu'une dimension parmi d'autres.`,`Les étiquettes sont les cibles, pas des motifs.`]}],
 sk:[`Décrire une architecture CNN`,`Lire la forme des cartes`],res:[`Convolution = détection locale partagée ; pooling = synthèse ; hiérarchie de motifs`],nx:[`cv-transfer`,`Et si un modèle pré-entraîné faisait le gros du travail ?`]};

L["cv-transfer"]={t:`Transfer learning : monter sur les épaules des géants`,l:9,p:"dl",d:`50 min`,
 obj:[`Réutiliser un modèle pré-entraîné (ResNet, EfficientNet)`,`Fine-tuner les dernières couches`],pre:[`cv-cnn`],
 th:`<p>Entraîner un CNN de zéro exige des millions d'images. Le <b>transfer learning</b> contourne le problème : on prend un modèle entraîné sur ImageNet (1,4 M d'images) — ses premières couches savent déjà détecter bords et textures — et on remplace sa tête de classification par la nôtre, qu'on entraîne sur <i>nos</i> données. Quelques centaines d'images suffisent alors là où il en fallait des millions. C'est la technique n°1 de la vision en entreprise — et le même principe nourrit le NLP moderne.</p>`,
 quiz:[{type:"qcm",q:`Le transfer learning consiste à :`,o:[`réutiliser un modèle pré-entraîné et l'adapter à sa tâche`,`entraîner deux modèles en parallèle`,`transférer les données sur GPU`],g:0,e:`On capitalise sur des représentations déjà apprises.`,w:[`Aucun parallélisme là-dedans.`,`Le GPU est une question matérielle.`]}],
 sk:[`Charger un modèle torchvision`,`Geler puis dégeler des couches`],res:[`Pré-entraîné + fine-tuning = performance pro avec peu de données`],nx:[`nlp-texte`,`Même logique pour le texte.`]};

L["nlp-texte"]={t:`NLP : du texte aux nombres, la tokenisation`,l:10,p:"dl",d:`50 min`,
 obj:[`Tokeniser un texte`,`Comprendre vocabulaire et sac-de-mots`,`Préparer un corpus`],pre:[`dl-mlp`,`py-pandas`],
 th:`<p>Une machine ne lit pas : elle compte. La <b>tokenisation</b> découpe le texte en unités (mots ou sous-mots). Chaque token reçoit un identifiant ; le <b>vocabulaire</b> est la liste de tous les tokens connus. Premiers modèles : sac-de-mots (compter les mots, ignorer l'ordre) puis TF-IDF (pondérer les mots rares). Limites évidentes : « chien » et « chiot » n'ont rien en commun dans ce monde de comptage. Il faut des représentations qui capturent le <i>sens</i> — ce sont les embeddings.</p>`,
 quiz:[{type:"qcm",q:`La tokenisation sert à :`,o:[`découper le texte en unités exploitables`,`traduire le texte`,`corriger les fautes`],g:0,e:`C'est la première étape de toute chaîne NLP.`,w:[`La traduction vient bien plus tard.`,`Le nettoyage est une étape distincte.`]}],
 sk:[`Tokeniser avec split ou un tokenizer`,`Construire un vocabulaire`],res:[`Token → identifiant → représentation ; l'ordre et le sens arrivent après`],nx:[`nlp-embed`,`Donnons du sens aux mots.`]};

L["nlp-embed"]={t:`Embeddings : la géométrie du sens`,l:10,p:"dl",d:`50 min`,
 obj:[`Comprendre un embedding comme un vecteur de sens`,`Saisir les analogies vectoriennes (roi − homme + femme ≈ reine)`],pre:[`nlp-texte`,`m-vecteurs`],
 th:`<p>Un <b>embedding</b> représente chaque mot (ou token) par un vecteur dense — et la magie : des mots proches en <i>sens</i> sont proches dans l'espace vectoriel. Word2Vec l'a montré en 2013 : ces vecteurs codent des relations (roi − homme + femme ≈ reine). D'où viennent-ils ? De l'entraînement sur d'énormes corpus : « dis-moi qui sont tes voisins de texte, je te dirai qui tu es ». Aujourd'hui, tous les LLM travaillent dans ces espaces — c'est aussi ce que stocke une base « vectorielle » pour la recherche sémantique.</p>`,
 quiz:[{type:"qcm",q:`Un embedding représente un mot par :`,o:[`sa première lettre`,`un vecteur de nombres capturant son sens`,`sa fréquence exacte`],g:1,e:`Le vecteur encode la sémantique : proximité = similarité de sens.`,w:[`Réduction bien trop brutale.`,`La fréquence n'est qu'un indice parmi d'autres.`]}],
 sk:[`Charger des embeddings pré-entraînés`,`Mesurer une similarité cosinus`],res:[`Mots = vecteurs ; similarité vectorielle = similarité de sens`],nx:[`nlp-transformers`,`L'architecture qui a tout changé.`]};

L["nlp-transformers"]={t:`Transformers & attention : l'architecture qui a tout changé`,l:10,p:"dl",d:`60 min`,
 obj:[`Expliquer l'attention en une phrase`,`Situer BERT, GPT et les LLM`],pre:[`nlp-embed`,`dl-mlp`],
 th:`<p>Le mécanisme d'<b>attention</b> (2017, « Attention Is All You Need ») laisse chaque token regarder <b>tous les autres tokens</b> de la phrase et décider lesquels compter pour se comprendre lui-même. « La banque du fleuve » vs « la banque de France » : l'attention résout l'ambiguïté par le contexte. Empilez ces couches, entraînez sur des téraoctets de texte, et vous obtenez les <b>LLM</b> : BERT (comprendre, bidirectionnel), GPT (générer, mot après mot). Comprendre ce que fait l'attention — des produits scalaires entre requêtes, clés et valeurs — vous êtes en terrain conquis : encore le produit scalaire du niveau 3.</p>`,
 quiz:[{type:"qcm",q:`Le mécanisme central des Transformers est :`,o:[`la convolution`,`l'attention`,`le pooling`],g:1,e:`Chaque token pondère l'importance de tous les autres.`,w:[`La convolution appartient aux CNN.`,`Le pooling résume, sans interactions.`]}],

L["mlops-git"]={t:`Git & GitHub pour le ML`,l:11,p:"env",d:`50 min`,
 obj:[`Versionner code ET expérimentations`,`Écrire un README de projet ML`],pre:[`env-decouverte`],
 th:`<p>Un projet ML, c'est du code + des données + des modèles + des réglages. Git versionne le code (<code>init, add, commit, push</code>), les branches isolent les essais, la pull request ouvre la discussion. Règles ML : jamais de données brutes ni de gros modèles dans le dépôt (<code>.gitignore</code>) ; notez les hyperparamètres et les scores dans le commit ou un fichier d'expérience ; le README explique données, entraînement et reproduction. GitHub héberge et rend tout cela collaboratif.</p>
 ${codeBlock(`git init && git add . && git commit -m "RF baseline : F1 0.83"
git checkout -b essai-xgboost
git push origin essai-xgboost`,"bash")}`,
 quiz:[{type:"qcm",q:`git commit sert à :`,o:[`envoyer le code sur GitHub`,`enregistrer un instantané versionné des modifications`,`supprimer l'historique`],g:1,e:`Le commit est une photographie locale ; push l'envoie ensuite.`,w:[`Ça, c'est push.`,`Git conserve au contraire l'historique.`]}],
 sk:[`add/commit/push`,`Créer une branche d'expérimentation`],res:[`Versionner le code, tracer les expériences, ignorer les données brutes`],nx:[`mlops-api`,`Le modèle vit sur votre machine : exposez-le au monde.`]};

L["mlops-api"]={t:`FastAPI : transformer un modèle en service web`,l:11,p:"env",d:`55 min`,
 obj:[`Servir un modèle via une route /predict`,`Échanger des données en JSON`],pre:[`mlops-git`,`ml-pipelines`],
 th:`<p>Un modèle dans un notebook ne sert à personne. Une <b>API</b> le met à disposition de n'importe quelle application : le client envoie du JSON, le serveur charge le modèle, prédit, répond en JSON. FastAPI le fait en dix lignes, avec documentation automatique.</p>
 ${codeBlock(`from fastapi import FastAPI
import joblib

app = FastAPI()
modele = joblib.load("modele.pkl")     # modèle sauvegardé

@app.post("/predict")
def predire(donnees: dict):
    X = [[donnees["surface"], donnees["pieces"]]]
    return {"loyer_pred": float(modele.predict(X)[0])}`)}
 <p>On lance avec <code>uvicorn main:app</code>, et l'application web, mobile ou métier consomme votre modèle sans rien savoir de Python.</p>`,
 quiz:[{type:"qcm",q:`Le rôle d'une API de prédiction :`,o:[`réentraîner le modèle chaque nuit`,`recevoir des données et renvoyer une prédiction`,`stocker le dataset`],g:1,e:`Requête JSON entrante → prédiction JSON sortante.`,w:[`Le réentraînement est un autre processus.`,`Le stockage est le rôle d'une base.`]}],
 sk:[`Écrire une route FastAPI`,`Sérialiser un modèle avec joblib`],res:[`API = le pont entre votre modèle et le monde réel`],nx:[`mlops-docker`,`Et pour que ça tourne partout, pareil, à chaque fois…`]};

L["mlops-docker"]={t:`Docker : « ça marche sur ma machine » → « partout »`,l:11,p:"env",d:`55 min`,
 obj:[`Comprendre image vs conteneur`,`Écrire un Dockerfile pour une API ML`],pre:[`mlops-api`],
 th:`<p>Une <b>image</b> Docker est un moule : système minimal + Python + bibliothèques + votre code. Un <b>conteneur</b> est une instance qui tourne, identique sur votre portable, celui du collègue et le serveur de production. Le <code>Dockerfile</code> décrit la recette :</p>
 ${codeBlock(`FROM python:3.12-slim
WORKDIR /app
COPY requirements.txt .
RUN pip install -r requirements.txt
COPY . .
CMD ["uvicorn", "main:app", "--host", "0.0.0.0"]`,"dockerfile")}
 ${codeBlock(`docker build -t mon-api-ml .
docker run -p 8000:8000 mon-api-ml`,"bash")}
 <p>Reproductibilité totale : c'est la brique de base du MLOps moderne, avant l'orchestration (CI/CD, Kubernetes) que vous découvrirez en poste.</p>`,
 quiz:[{type:"qcm",q:`Un conteneur Docker est :`,o:[`une machine virtuelle complète`,`une instance légère et isolée d'une image`,`un fichier de logs`],g:1,e:`Il partage le noyau de l'hôte : léger, isolé, identique partout.`,w:[`Une VM émule du matériel ; pas un conteneur.`,`Les logs vivent dedans, mais ne le définissent pas.`]}],

L["mlops-suivi"]={t:`Monitoring : un modèle en production est vivant`,l:11,p:"ml",d:`45 min`,

/* ================= MOTEUR ================= */
const pct=()=>Math.round(ORDER.filter(isDone).length/ORDER.length*100);
const lvlPct=n=>{const ls=LEVELS[n].ls;return Math.round(ls.filter(isDone).length/ls.length*100)};
function pilLessons(p){return ORDER.filter(id=>{const x=L[id];if(p==="dl")return x.l>=8&&x.l<=10;return x.p===p&&!(x.l>=8&&x.l<=10)})}
const pilPct=p=>{const ls=pilLessons(p);return Math.round(ls.filter(isDone).length/ls.length*100)};
function rank(){const p=pct();return p<12?"Débutant·e":p<35?"Apprenti·e":p<60?"Intermédiaire":p<85?"Avancé·e":"Expert·e"}
function nextLesson(){return ORDER.find(x=>!isDone(x))||null}
const IC={obj:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>',
th:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/></svg>',
math:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 5H7l5.5 7L7 19h11"/></svg>',
code:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m8 8-4 4 4 4M16 8l4 4-4 4"/></svg>',
quiz:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 9a3 3 0 1 1 4.6 2.5c-1 .7-1.6 1.3-1.6 2.5m0 3.5h.01"/><circle cx="12" cy="12" r="9"/></svg>',
proj:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V4h12l-2 3.5L16 11H4"/></svg>',
check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m4 12.5 5 5L20 6.5"/></svg>'};

const QINDEX={};
ORDER.forEach(id=>(L[id].quiz||[]).forEach((q,i)=>QINDEX[id+"-"+i]=q));
function quizHTML(q,uid){
  const letters="ABCD";
  return `<div class="quiz" data-uid="${uid}">
   <div class="qq"><span class="qtag">${q.type==="vf"?"Vrai / Faux":"QCM"}</span><span>${q.q}</span></div>
   <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${letters[i]}</span><span>${o}</span></button>`).join("")}</div>
   <div class="qfb" hidden></div></div>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest(".opt"); if(!b||b.disabled)return;
  const qz=b.closest(".quiz"), i=+b.dataset.i, q=QINDEX[qz.dataset.uid]; if(!q)return;
  const good=i===q.g;
  qz.querySelectorAll(".opt").forEach((o,j)=>{o.disabled=true; if(j===q.g)o.classList.add("good")});
  if(!good)b.classList.add("bad");
  const fb=qz.querySelector(".qfb");
  let why="";
  if(q.w&&q.w.length){why=`<div class="why"><b>Pourquoi pas les autres ?</b><ul>${q.o.map((o,j)=>j===q.g?"":`<li><b>${"ABCD"[j]}.</b> ${q.w[j-(j>q.g?1:0)]||""}</li>`).join("")}</ul></div>`}
  fb.innerHTML=`<span class="v ${good?"ok":"ko"}">${good?"✓ Bonne réponse":"✗ Pas tout à fait"}</span> — la bonne réponse était <b>${"ABCD"[q.g]}</b>.<p>${q.e}</p>${why}`;
  fb.hidden=false;
  S.quiz[qz.dataset.uid]=good; save(); refreshHdr();
});

function renderLesson(id){
  const le=L[id],pil=PIL[le.p]||PIL.ml;
  const idx=ORDER.indexOf(id), prev=ORDER[idx-1];
  let n=0;
  const sec=(ic,title,inner,pc)=>{n++;return `<div class="lsec"${pc?` style="--pc:${pc}"`:""}><div class="stt"><span class="ic">${ic}</span><h2>${n} · ${title}</h2></div>${inner}</div>`};
  let h=`<div style="--pc:${pil.c}">
  <div style="font-size:12px;color:var(--mut)"><a href="#" class="go" data-v="parcours">Parcours</a> › Niveau ${le.l} — ${LEVELS[le.l].t}</div>
  <div class="lhero"><div>
    <div class="kicker" style="color:${pil.c}">${pil.n}${le.full?" · LEÇON COMPLÈTE":" · FICHE SYNTHÈSE"}</div>
    <h1>${le.t}</h1>
    <div class="meta"><span class="tag dur">⏱ ${le.d}</span>
      <span class="tag ${le.full?"full":"syn"}">${le.full?"Théorie + pratique + exercices":"Synthèse — détails à venir"}</span>
      <span class="tag dur">Niveau ${le.l}</span></div>
  </div>
  <button class="btn" id="doneBtn">${isDone(id)?"✓ Leçon terminée":"Marquer comme terminée"}</button></div>`;
  h+=sec(IC.obj,`Objectifs & prérequis`,`<div class="bd"><div class="objgrid">
    <div><h4>À la fin de cette leçon, vous saurez :</h4><ul>${le.obj.map(o=>`<li>${o}</li>`).join("")}</ul></div>
    <div><h4>Prérequis :</h4>${le.pre&&le.pre.length?`<ul>${le.pre.map(p=>`<li><a href="#" class="go" data-v="lesson" data-id="${p}" style="color:${pil.c}">${L[p].t}</a></li>`).join("")}</ul>`:`<p>Aucun — c'est un point de départ. 🚀</p>`}</div>
  </div></div>`);
  if(!le.full){
    h+=sec(IC.th,`L'essentiel`,`<div class="bd">${le.th}</div>`);
    h+=`<div class="lsec"><div class="bd" style="border-style:dashed;text-align:center;color:var(--mut);padding:26px">
      <b>📦 Sections « Intuition », « Mathématiques détaillées », « Python pas à pas », « Mini-projet » prévues pour cette leçon.</b><br>
      Elles seront développées dans le fichier de contenu suivant — la structure est déjà en place : chaque section s'affichera ici automatiquement.</div></div>`;
    h+=sec(IC.quiz,`Exercice — vérifiez tout de suite`,le.quiz.map((q,i)=>quizHTML(q,id+"-"+i)).join(""));
  }else{
    h+=sec(IC.th,`Théorie & intuition`,`<div class="bd">${le.th}${le.int?`<h4 style="margin-top:20px">💡 Intuition</h4>${le.int}`:""}</div>`);
    if(le.maths)h+=sec(IC.math,`Mathématiques`,`<div class="bd">${le.maths}</div>`,"var(--c-math)");
    if(le.py)h+=sec(IC.code,`Python — le code pas à pas`,`<div class="bd">
      ${codeBlock(le.py.code)}${le.py.out?`<div class="out">${esc(le.py.out)}</div>`:""}
      ${le.py.expl?`<button class="expl-toggle" data-t="ex1">▸ Afficher l'explication ligne par ligne</button><div class="expl-list" id="ex1" hidden>${le.py.expl.map(e=>`<div class="er"><b>L${e[0]}</b><div>${e[1]}</div></div>`).join("")}</div>`:""}
      ${le.py2?`<h4 style="margin-top:22px">${le.py2.titre}</h4>${codeBlock(le.py2.code)}${le.py2.out?`<div class="out">${esc(le.py2.out)}</div>`:""}${le.py2.expl?`<button class="expl-toggle" data-t="ex2">▸ Afficher l'explication ligne par ligne</button><div class="expl-list" id="ex2" hidden>${le.py2.expl.map(e=>`<div class="er"><b>L${e[0]}</b><div>${e[1]}</div></div>`).join("")}</div>`:""}`:""}
    </div>`,"var(--c-py)");
    if(le.viz)h+=sec(IC.obj,`Visualisation interactive`,le.viz.map(v=>VIZHTML[v]).join(""));
    if(le.ml)h+=sec(IC.th,`Côté Machine Learning`,`<div class="bd">${le.ml}${le.ex?`<h4 style="margin-top:18px">🌍 Exemple réel</h4>${le.ex}`:""}</div>`);
    h+=sec(IC.quiz,`Exercices`,le.quiz.map((q,i)=>quizHTML(q,id+"-"+i)).join(""));
    if(le.mp)h+=sec(IC.proj,`Mini-projet — ${le.mp.n}`,`<div class="bd"><p>${le.mp.d}</p>
      ${le.mp.etapes?`<h4>Étapes conseillées</h4><ol>${le.mp.etapes.map(e=>`<li>${e}</li>`).join("")}</ol>`:""}
      <div class="callout warn"><b class="t">⚡ Challenge</b>${le.mp.ch}</div></div>`,"var(--c-py)");
  }
  h+=sec(IC.check,`Résumé & compétences`,`<div class="bd"><div class="objgrid">
    <div><h4>À retenir</h4><ul>${le.res.map(r=>`<li>${r}</li>`).join("")}</ul></div>
    <div><h4>Compétences acquises</h4><ul>${le.sk.map(s=>`<li>${s}</li>`).join("")}</ul></div></div>
    ${le.liens?`<h4>🔗 Liens entre les piliers</h4><div class="linkrow">${le.liens.map(([lid,lbl])=>`<button class="pchip go" data-v="lesson" data-id="${lid}" style="--pc:${PIL[L[lid].p].c}">${PIL[L[lid].p].n.split(" ")[0]} · ${lbl}</button>`).join("")}</div>`:""}
  </div>`);
  h+=`<div class="lsec" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
    ${prev?`<a href="#" class="btn ghost sm go" data-v="lesson" data-id="${prev}">← ${L[prev].t}</a>`:""}
    ${le.nx&&L[le.nx[0]]&&le.nx[0]!==id?`<div style="flex:1;min-width:240px;font-size:13.5px;color:var(--mut)"><b style="color:${pil.c}">Étape suivante :</b> ${le.nx[1]}</div>
    <a href="#" class="btn sm go" data-v="lesson" data-id="${le.nx[0]}">${L[le.nx[0]].t} →</a>`:""}
  </div></div>`;
  $("#v-lesson").innerHTML=h;
  const db=$("#doneBtn");
  const paint=()=>{const d=isDone(id);db.textContent=d?"✓ Leçon terminée":"Marquer comme terminée";db.className="btn "+(d?"":"ghost");db.style.cssText=d?"background:var(--c-ml);border-color:var(--c-ml);color:#fff":""};
  paint();
  db.onclick=()=>{if(S.done[id])delete S.done[id];else S.done[id]=true;save();paint();refreshHdr();refreshCards()};
  $$("#v-lesson .expl-toggle").forEach(b=>b.onclick=()=>{const t=document.getElementById(b.dataset.t);t.hidden=!t.hidden;b.textContent=t.hidden?"▸ Afficher l'explication ligne par ligne":"▾ Masquer l'explication"});
  initViz(); reveal();
}

function laneCard(id){
  const le=L[id],c=(PIL[le.p]||PIL.ml).c;
  return `<button class="lcard go ${isDone(id)?"isdone":""}" data-v="lesson" data-id="${id}" style="--pc:${c}">
   <span class="tt"><span class="chk">${isDone(id)?"✓":""}</span><span>${le.t}</span></span>
   <span class="mt"><span class="tag ${le.full?"full":"syn"}">${le.full?"Complète":"Synthèse"}</span><span class="tag dur">${le.d}</span></span></button>`;
}
function refreshCards(){$$(".lcard").forEach(c=>{const id=c.dataset.id;c.classList.toggle("isdone",isDone(id));c.querySelector(".chk").textContent=isDone(id)?"✓":""})}
function renderParcours(){
  let h=`<div class="kicker">Le parcours</div><h1 class="h1">13 niveaux, 3 piliers, ${LESSONS} leçons</h1>
  <p class="sub" style="margin:10px 0 8px">Chaque niveau fait avancer <b>ensemble</b> le Machine Learning, Python et les mathématiques. Les leçons <span class="tag full">Complètes</span> contiennent théorie détaillée, code expliqué ligne par ligne, visualisations et mini-projet.</p>
  <div class="lane-hd" style="margin-top:26px">${[["ml","🧠 Machine Learning","concepts & algorithmes"],["py","🐍 Python","le code qui implémente"],["math","📐 Mathématiques","le pourquoi des formules"]].map(x=>`<div class="lh" style="--pc:${PIL[x[0]].c}">${x[1]} <small>${x[2]}</small></div>`).join("")}</div>`;
  LEVELS.forEach(lv=>{
    const lanes={ml:[],py:[],math:[]};
    lv.ls.forEach(id=>{const p=L[id].p==="env"?"py":L[id].p;(lanes[p]||(lanes[p]=[])).push(id)});
    h+=`<div class="level-block rv"><div class="lvnum"><div><small>NIVEAU</small><span>${lv.n}</span></div></div>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><div class="lt">${lv.t}</div>
      <div style="flex:1;min-width:140px;max-width:260px"><div class="bar"><i style="width:${lvlPct(lv.n)}%"></i></div></div>
      <span style="font-size:12.5px;color:var(--mut)">${lv.ls.filter(isDone).length}/${lv.ls.length} leçons · ${lvlPct(lv.n)} %</span></div>
      <div class="ld">${lv.d}</div>
      <div class="lanes">${["ml","py","math"].map(p=>lanes[p].length?`<div class="lane" style="--pc:${PIL[p].c}">${lanes[p].map(laneCard).join("")}</div>`:`<div class="lane"><div class="lane-empty">—</div></div>`).join("")}</div></div>`;
  });
  $("#v-parcours").innerHTML=h; reveal();
}
function renderPillar(key){
  const cfg={ml:{t:"Machine Learning",d:"Concepts, algorithmes, évaluation, feature engineering et ML avancé — le cœur du parcours."},
   py:{t:"Python & Programmation",d:"Le langage enseigné en parallèle du ML : des variables jusqu'à PyTorch, toujours au service d'un concept."},
   math:{t:"Mathématiques",d:"Uniquement ce qui sert, au moment où ça sert : fonctions, vecteurs, probabilités, dérivées, gradients."},
   dl:{t:"Deep Learning",d:"Niveaux 8 à 10 : neurones, CNN, NLP et Transformers."}}[key];
  const c=key==="dl"?"var(--c-dl)":PIL[key].c;
  let h=`<div class="kicker" style="color:${c}">Pilier</div><h1 class="h1">${cfg.t}</h1><p class="sub" style="margin:10px 0 22px">${cfg.d}</p>
  <div style="display:flex;gap:14px;align-items:center;margin-bottom:26px"><div class="bar lg" style="flex:1;max-width:340px;--pc:${c}"><i style="width:${pilPct(key)}%"></i></div><b style="font-family:'Space Grotesk'">${pilPct(key)} %</b></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px">`;
  pilLessons(key).forEach(id=>h+=laneCard(id));
  h+="</div>";
  $("#v-pillar").innerHTML=h; reveal();
}

    h+=`<div class="proj rv" data-i="${i}"><div class="ph"><span class="pn">${String(i+1).padStart(2,"0")}</span>

      <h4>Étapes</h4><ol>${p.etapes.map(e=>`<li>${e}</li>`).join("")}</ol>
      ${p.code?`<h4>Code de démarrage</h4>${codeBlock(p.code)}`:""}
      <h4>Résultat attendu</h4><p style="font-size:14px">${p.res}</p>
      <h4>Exercices supplémentaires</h4><ul>${p.exos.map(x=>`<li>${x}</li>`).join("")}</ul>
      <div class="callout warn"><b class="t">⚡ Challenge</b>${p.ch}</div></div></div>`;

  h+="</div>";

function renderExercices(){
  const items=ORDER.flatMap(id=>(L[id].quiz||[]).map((q,i)=>({idq:id+"-"+i,q,le:L[id]})));
  let h=`<div class="kicker">Entraînement</div><h1 class="h1">Exercices interactifs</h1>
  <p class="sub" style="margin:10px 0 6px">Répondez : la correction détaillée s'affiche immédiatement, avec l'explication des autres réponses.</p>
  <p style="font-size:13.5px;color:var(--mut);margin-bottom:22px">Bonnes réponses enregistrées : <b style="color:var(--c-ml)">${Object.values(S.quiz).filter(v=>v).length}</b></p>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:14px;align-items:start">`;
  items.forEach(it=>{h+=`<div><div style="font-size:11px;color:var(--mut);margin:0 0 6px 4px">${it.le.t} · niveau ${it.le.l}</div>${quizHTML(it.q,it.idq)}</div>`});
  h+="</div>";
  $("#v-exercices").innerHTML=h; reveal();
}
function renderEnv(){
  let h=`<div class="kicker">Les outils</div><h1 class="h1">Votre environnement de travail</h1>
  <p class="sub" style="margin:10px 0 26px">Tout ce qu'il faut installer et maîtriser, expliqué sans jargon.</p><div class="envgrid">
  <div class="envtabs">${ENV.map((e,i)=>`<button data-i="${i}" class="${i===0?"on":""}">${e.ic} ${e.t}</button>`).join("")}</div>
  <div id="envBody" class="card pad"></div></div>`;

function vizReg(){
 const cv=$("#cvReg");const P=[[12,53],[18,61],[25,79],[31,88],[38,102],[45,118],[52,131],[60,149],[68,168],[75,181],[82,199],[90,214]];
 let a=+$("#vr-a").value,b=+$("#vr-b").value,anim=null;
 const W0=()=>cv.getBoundingClientRect().width;
 const sx=x=>30+x/100*(W0()-50), sy=y=>280-y/240*250;
 const mse=()=>P.reduce((s,p)=>s+((a*p[0]+b)-p[1])**2,0)/P.length;
 function draw(){const [c,W,H]=cvx(cv);c.clearRect(0,0,W,H);
  c.strokeStyle=css("--line");c.beginPath();c.moveTo(sx(0),sy(0));c.lineTo(sx(100),sy(0));c.moveTo(sx(0),sy(0));c.lineTo(sx(0),sy(240));c.stroke();
  const ml=css("--c-ml");
  P.forEach(([x,y])=>{const py=a*x+b;c.strokeStyle=css("--c-dl");c.globalAlpha=.45;c.beginPath();c.moveTo(sx(x),sy(y));c.lineTo(sx(x),sy(py));c.stroke();c.globalAlpha=1});
  c.strokeStyle=ml;c.lineWidth=2.5;c.beginPath();c.moveTo(sx(0),sy(b));c.lineTo(sx(100),sy(a*100+b));c.stroke();c.lineWidth=1;
  c.fillStyle=css("--c-math");P.forEach(([x,y])=>{c.beginPath();c.arc(sx(x),sy(y),4.5,0,7);c.fill()});
  c.fillStyle=css("--mut");c.font="11px IBM Plex Mono";c.fillText("x (feature)",sx(70),sy(0)+16);
  $("#vr-mse").textContent=mse().toFixed(1)}
 $("#vr-a").oninput=e=>{a=+e.target.value;cancelAnimationFrame(anim);draw()};
 $("#vr-b").oninput=e=>{b=+e.target.value;cancelAnimationFrame(anim);draw()};
 $("#vr-fit").onclick=()=>{a=0;b=10;cancelAnimationFrame(anim);
   (function step(){let ga=0,gb=0;P.forEach(([x,y])=>{const e=a*x+b-y;ga+=2*e*x/P.length;gb+=2*e/P.length});
    a-=0.02*ga;b-=0.02*gb;$("#vr-a").value=a;$("#vr-b").value=b;draw();
    if(Math.abs(ga)+Math.abs(gb)>0.02)anim=requestAnimationFrame(step)})()};
 draw();
}
function vizGd(){
 const cv=$("#cvGd");const f=w=>0.55*(w-3)**2+0.5,df=w=>1.1*(w-3);
 let w=0.2,lr=0.25,hist=[0.2],auto=null;
 function draw(){const [c,W,H]=cvx(cv);c.clearRect(0,0,W,H);
  const sx=x=>30+x/6*(W-50), sy=y=>H-26-y/8*(H-50);
  c.strokeStyle=css("--line");c.beginPath();c.moveTo(sx(0),sy(0));c.lineTo(sx(6),sy(0));c.stroke();
  c.strokeStyle=css("--c-math");c.lineWidth=2;c.beginPath();for(let x=0;x<=6;x+=.05){const X=sx(x),Y=sy(f(x));x===0?c.moveTo(X,Y):c.lineTo(X,Y)}c.stroke();c.lineWidth=1;
  c.fillStyle=css("--mut");c.font="11px IBM Plex Mono";c.fillText("J(w) — le coût",sx(4.4),sy(f(6))+4);c.fillText("w",sx(5.8),sy(0)+16);
  c.globalAlpha=.35;c.strokeStyle=css("--c-dl");c.beginPath();hist.forEach(x=>{c.moveTo(sx(x),sy(f(x)));c.lineTo(sx(x),sy(0))});c.stroke();c.globalAlpha=1;
  hist.forEach(x=>{c.fillStyle=css("--c-dl");c.beginPath();c.arc(sx(x),sy(f(x)),3,0,7);c.fill()});
  c.fillStyle=css("--c-ml");c.beginPath();c.arc(sx(w),sy(f(w)),8,0,7);c.fill();
  $("#vg-ro").innerHTML=`w = <b>${w.toFixed(3)}</b> · J(w) = <b>${f(w).toFixed(3)}</b> · gradient = <b>${df(w).toFixed(2)}</b>`}
 const step=()=>{w=Math.max(-3,Math.min(9,w-lr*df(w)));hist.push(w);if(hist.length>60)hist.shift();draw()};
 $("#vg-step").onclick=step;
 $("#vg-lr").oninput=e=>lr=+e.target.value;
 $("#vg-reset").onclick=()=>{w=0.2;hist=[0.2];clearInterval(auto);auto=null;$("#vg-auto").textContent="Lecture auto";draw()};
 $("#vg-auto").onclick=function(){if(auto){clearInterval(auto);auto=null;this.textContent="Lecture auto"}else{auto=setInterval(step,420);this.textContent="⏸ Pause"}};
 draw();
}
function vizKm(){
 const cv=$("#cvKm");let pts=[],cents=[],assign=[],it=0,run=null;
 const CL=[css("--c-ml"),css("--c-py"),css("--c-math")];
 function gen(){const W=cv.getBoundingClientRect().width;pts=[];const cs=[[.2,.3],[.75,.25],[.5,.78]];
  cs.forEach(([cx,cy])=>{for(let i=0;i<26;i++)pts.push([cx*W+(Math.random()+Math.random()+Math.random()-1.5)*38,cy*300+(Math.random()+Math.random()+Math.random()-1.5)*38])});
  cents=[pts[3].slice(),pts[35].slice(),pts[62].slice()];assign=pts.map(()=>0);it=0;draw()}
 function inertia(){return pts.reduce((s,p,i)=>s+(p[0]-cents[assign[i]][0])**2+(p[1]-cents[assign[i]][1])**2,0)/pts.length}
 function stepK(){pts.forEach((p,i)=>{let bi=0,bd=1e9;cents.forEach((c,k)=>{const d=(p[0]-c[0])**2+(p[1]-c[1])**2;if(d<bd){bd=d;bi=k}});assign[i]=bi});
  cents=cents.map((c,k)=>{const m=pts.filter((p,i)=>assign[i]===k);return m.length?[m.reduce((s,p)=>s+p[0],0)/m.length,m.reduce((s,p)=>s+p[1],0)/m.length]:c});
  it++;draw()}
 function draw(){const [c,W,H]=cvx(cv);c.clearRect(0,0,W,H);
  pts.forEach((p,i)=>{c.fillStyle=CL[assign[i]];c.globalAlpha=.75;c.beginPath();c.arc(p[0],p[1],4,0,7);c.fill()});c.globalAlpha=1;
  cents.forEach((ct,k)=>{c.fillStyle=CL[k];c.strokeStyle=css("--ink");c.lineWidth=2;c.beginPath();c.arc(ct[0],ct[1],9,0,7);c.fill();c.stroke();
   c.beginPath();c.moveTo(ct[0]-4,ct[1]);c.lineTo(ct[0]+4,ct[1]);c.moveTo(ct[0],ct[1]-4);c.lineTo(ct[0],ct[1]+4);c.strokeStyle="#fff";c.stroke()});c.lineWidth=1;
  $("#km-it").textContent=it;$("#km-in").textContent=inertia().toFixed(0)}
 $("#km-new").onclick=()=>{clearInterval(run);run=null;gen()};
 $("#km-step").onclick=stepK;
 $("#km-run").onclick=()=>{if(run){clearInterval(run);run=null;return}run=setInterval(()=>{const b=inertia();stepK();if(Math.abs(b-inertia())<0.5){clearInterval(run);run=null}},450)};
 gen();
}

   c.strokeStyle=w[i]>=0?css("--c-ml"):css("--c-dl");c.lineWidth=Math.min(5,Math.abs(w[i])*1.6+.5);
   c.beginPath();c.moveTo(cx+14,y);c.lineTo(nx-34,ny);c.stroke();c.lineWidth=1;
   c.fillStyle=css("--bg2");c.strokeStyle=css("--line");c.beginPath();c.arc(cx,y,15,0,7);c.fill();c.stroke();
   c.fillStyle=css("--ink");c.font="600 11px IBM Plex Mono";c.fillText("x"+(i+1),cx-6,y+4);
   c.fillStyle=css("--mut");c.font="11px IBM Plex Sans";c.fillText(labs[i],cx-14,y+32);
   c.fillStyle=w[i]>=0?css("--c-ml"):css("--c-dl");c.font="600 11px IBM Plex Mono";c.fillText("w="+w[i].toFixed(1),(cx+nx*.4)/1.9,y-8+(i-1)*14)});
  c.fillStyle=css("--bg2");c.strokeStyle=css("--c-dl");c.lineWidth=2;c.beginPath();c.arc(nx,ny,30,0,7);c.fill();c.stroke();c.lineWidth=1;
  c.fillStyle=css("--ink");c.font="600 12px Space Grotesk";c.fillText("Σ + b",nx-17,ny+4);
  c.strokeStyle=css("--mut");c.beginPath();c.moveTo(nx+30,ny);c.lineTo(W*.8,ny);c.stroke();
  c.fillStyle=css("--c-py");c.globalAlpha=.25+out*.75;c.beginPath();c.arc(W*.86,ny,26,0,7);c.fill();c.globalAlpha=1;
  c.strokeStyle=css("--c-py");c.beginPath();c.arc(W*.86,ny,26,0,7);c.stroke();
  c.fillStyle=css("--ink");c.font="700 14px Space Grotesk";c.fillText(out.toFixed(2),W*.86-13,ny+5);
  c.fillStyle=css("--mut");c.font="11px IBM Plex Mono";c.fillText("z = "+z.toFixed(2),nx-16,ny+52);c.fillText("σ(z)",W*.86-12,ny+44);
  $("#nbulb").style.opacity=.2+out*.8;$("#nout").textContent=out.toFixed(3)}
 ["nw1","nw2","nw3","nb"].forEach(id=>document.getElementById(id).oninput=draw);draw();
}
function heroDemo(){
 const cv=$("#heroViz");if(!cv)return;
 const P=Array.from({length:16},(_,i)=>[6+i*5.6,40+i*10.5+(Math.random()-.5)*36]);
 let a=0.4,b=150,ep=0;
 const sx=x=>26+x/96*(cv.getBoundingClientRect().width-46), sy=y=>212-y/230*190;
 function draw(){const [c,W,H]=cvx(cv);c.clearRect(0,0,W,H);
  c.strokeStyle=css("--line");c.beginPath();c.moveTo(sx(0),sy(0));c.lineTo(sx(96),sy(0));c.stroke();
  c.strokeStyle=css("--c-ml");c.lineWidth=2;c.beginPath();c.moveTo(sx(0),sy(b));c.lineTo(sx(96),sy(a*96+b));c.stroke();c.lineWidth=1;
  c.fillStyle=css("--c-math");P.forEach(([x,y])=>{c.beginPath();c.arc(sx(x),sy(y),3.6,0,7);c.fill()});
  const mse=P.reduce((s,p)=>s+((a*p[0]+b)-p[1])**2,0)/P.length;
  const st=$("#heroStat");if(st)st.textContent=`époque ${ep} · a=${a.toFixed(2)} · b=${b.toFixed(0)} · MSE=${mse.toFixed(1)}`}
 function tick(){let ga=0,gb=0;P.forEach(([x,y])=>{const e=a*x+b-y;ga+=2*e*x/P.length;gb+=2*e/P.length});
  a-=0.018*ga;b-=0.018*gb;ep++;draw();
  if(Math.abs(ga)+Math.abs(gb)>0.05){setTimeout(tick,40)}
  else setTimeout(()=>{a=0.4;b=150;ep=0;tick()},3500)}
 draw();setTimeout(tick,700);
}
